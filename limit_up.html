<style>
:root {

  --primary-soft: rgba(37, 99, 235, .1);

  --up: #dc2626;
  --down: #16a34a;
  --warn-bg: #fffbeb;
  --warn-bd: #fde68a;
  --warn-fg: #92400e;
  --err-bg: #fef2f2;
  --err-fg: #dc2626;
  --ok-bg: #ecfdf5;
  --ok-fg: #047857;
  --input-bg: #ffffff;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);

}

  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus-ring);

}

}

}

.toolbar {

}

.btn {

}

  font-weight: 500;
}
/* —— secondary menu (settings) —— */
.menu-wrap { position: relative; }
.menu-panel {
  display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
  width: min(420px, calc(100vw - 24px));

}

}
.menu-tab:hover { color: var(--text); background: var(--card); }

}
.menu-body { padding: 12px; }
.menu-pane { display: none; }
.menu-pane.active { display: block; }
.menu-pane label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.menu-row {

}

.menu-pane select, .menu-pane input, .menu-pane textarea {

  font-size: 12px; background: var(--input-bg); color: var(--text);
}
.menu-pane select { min-width: 120px; }
.menu-pane input { flex: 1; min-width: 160px; font-family: ui-monospace, Consolas, monospace; }
#prompt-text {

}
.menu-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.menu-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.btn.ghost.active { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.switch {
  position: relative; display: inline-flex; align-items: center;
  width: 40px; height: 22px; cursor: pointer; flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch-ui {
  position: absolute; inset: 0; border-radius: 999px;
  background: #475569; transition: background .15s ease;
}
.switch-ui::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%; background: var(--card);
  box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: transform .15s ease;
}
.switch input:checked + .switch-ui { background: var(--primary); }
.switch input:checked + .switch-ui::after { transform: translateX(18px); }
/* —— main 3-col —— */
.layout {
  flex: 1 1 auto; min-height: 0; position: relative;
  display: grid;
  grid-template-columns: minmax(200px, 0.62fr) minmax(320px, 1.25fr) minmax(0, 1.45fr);
  gap: var(--gap);
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);

  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.card-hd {

}

}
.tab-switch { display: flex; gap: 0; background: var(--hover); border-radius: 999px; padding: 3px; }

  font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .12s ease;
}
.tab-btn.active { background: var(--card); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.card-bd { flex: 1 1 auto; min-height: 0; overflow: auto; }
#event-card .card-hd { background: linear-gradient(90deg, var(--primary-soft), var(--card) 60%); }
.filter-bar {

}
.filter-bar .label { font-size: 11px; color: var(--muted); margin-right: 2px; }
.chip {

}
.chip:hover { border-color: var(--primary); color: var(--primary); }

.msg { margin: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px; }
.msg.loading { color: var(--muted); text-align: center; padding: 36px 12px; margin: 0; }
.msg.error { background: var(--err-bg); color: var(--err-fg); }

/* —— event cards —— */
.ev-list { display: flex; flex-direction: column; gap: 0; padding: 6px; }
.ev-item {
  border: 1px solid transparent; border-radius: 10px; padding: 10px 10px 8px;
  cursor: default; transition: background .12s, border-color .12s;
}
.ev-item:hover { background: var(--hover); }
.ev-item + .ev-item { border-top: 1px solid var(--border); border-radius: 0; }
.ev-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.ev-heat {
  flex: 0 0 auto; min-width: 44px; text-align: center;

}
.ev-heat.mid { color: var(--warn-fg); background: var(--warn-bg); }
.ev-heat.low { color: var(--muted); background: var(--hover); }
.ev-title {

}
.ev-dir {

}
.ev-themes { margin-bottom: 6px; }
.ev-stock {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;

}
.ev-stock b { color: var(--text); font-weight: 600; }
.ev-stock .rate { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
/* —— tables —— */
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th {

  color: var(--muted); font-weight: 650; white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
th.sortable { cursor: pointer; user-select: none; }

td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
#block-panel tbody tr { cursor: pointer; transition: background .12s ease; }

/* 整行统一底色，避免每格渐变割裂 */
#block-panel tbody tr.active td {

}

}

}
#stock-panel tbody tr { cursor: pointer; transition: background .12s ease; }

}

}

.stock-link {
  color: inherit; text-decoration: none; border-bottom: 1px dashed transparent;
  cursor: pointer; font-weight: 600;
}
.stock-link:hover { color: var(--primary); border-bottom-color: var(--primary); }
.code.stock-link { font-weight: 500; color: var(--muted); }
.code.stock-link:hover { color: var(--primary); }
/* stock detail (in-panel drill-in) */
#stock-card { position: relative; overflow: hidden; }
.stock-list-view {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%;
}
.stock-list-view.hidden { display: none; }

  }
  .stock-detail-loading .load-btn.primary:hover {
    filter: brightness(.96);
    color: #fff;
    border-color: transparent;
  }
  /* 涨停/炸板 · 个股明细内 K线/详情 */
  .pool-detail {
    display: flex; flex-direction: column; height: 100%; min-height: 0;
  }
  .pool-detail-tabs {
    flex: 0 0 auto;
    display: flex; gap: 0; padding: 6px 10px;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  .pool-detail-tabs .tab-switch { flex: 0 0 auto; }
  .pool-detail-tabs .tab-btn { padding: 5px 14px; font-size: 12px; }
  .pool-detail-body {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
  }
  .pool-detail-pane {
    display: none; position: absolute; inset: 0;
    overflow: auto; -webkit-overflow-scrolling: touch;
  }
  .pool-detail-pane.active { display: block; }
  .pool-detail-pane.pane-kline {
    overflow: hidden; background: var(--card);
    --ths-scale: var(--ths-scale-user, 1);
  }
  .pool-detail-pane.pane-kline iframe {
    position: absolute; top: 0; left: 0; border: 0; background: var(--card);
    width: calc(100% / var(--ths-scale));
    height: calc(100% / var(--ths-scale));
    transform: scale(var(--ths-scale));
    transform-origin: 0 0;
  }
  .pool-detail-pane.pane-info { padding: 0; }
  #stock-panel:has(.pool-detail) {
    display: flex; flex-direction: column; overflow: hidden; padding: 0;
  }
  #stock-panel:has(.pool-detail) > .pool-detail { flex: 1 1 auto; min-height: 0; }
  .num { font-family: ui-monospace, 'SF Mono', Consolas, monospace; text-align: right; white-space: nowrap; }
.code { font-family: ui-monospace, Consolas, monospace; color: var(--muted); font-size: 12px; }
.up { color: var(--up); font-weight: 600; }
.down { color: var(--down); font-weight: 600; }
.tag {
  display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: var(--hover); color: var(--muted); margin: 1px 3px 1px 0; white-space: nowrap;
}
.tag.first { background: var(--err-bg); color: var(--up); }
.tag.back { background: var(--ok-bg); color: var(--down); }
.tag.down { background: var(--ok-bg); color: var(--down); font-weight: 600; }
.reason {
  max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--muted); font-size: 12px;
}
.page-nav { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; }
.page-nav .btn { height: 28px; padding: 0 12px; font-size: 12px; }
.page-info { font-size: 12px; color: var(--muted); }
.scroll-more {
  text-align: center; padding: 12px; font-size: 12px; color: var(--muted);
}
.raw-toggle {
  display: inline-block; margin: 8px 12px 12px; font-size: 12px; color: var(--primary);
  cursor: pointer; text-decoration: underline; user-select: none;
}
.raw {
  display: none; margin: 0 12px 12px; padding: 10px; border-radius: 8px; max-height: 280px; overflow: auto;
  background: #0f172a; color: #e2e8f0; font: 11px/1.5 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; word-break: break-all;
}
.raw.open { display: block; }

/* —— export modal —— */
.modal-mask {
  display: none; position: fixed; inset: 0; z-index: 80;
  background: rgba(15, 23, 42, .4);
  align-items: center; justify-content: center; padding: 16px;
}
.modal-mask.open { display: flex; }
.modal {
  width: min(400px, 100%); background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: 0 16px 40px rgba(15, 23, 42, .2); overflow: hidden;
}
.modal-hd {
  padding: 14px 16px; font-size: 14px; font-weight: 700;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--card), var(--surface-2));
}
.modal-bd { padding: 14px 16px; }
.modal-hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.45; }
.export-opts { display: flex; flex-direction: column; gap: 8px; }
.export-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  cursor: pointer; background: var(--card); transition: border-color .12s, background .12s;
}
.export-opt:hover { border-color: var(--primary); background: var(--primary-soft); }
.export-opt input { margin-top: 2px; accent-color: var(--primary); }
.export-opt .opt-body { flex: 1; min-width: 0; }
.export-opt .opt-title { font-size: 13px; font-weight: 650; color: var(--text); }
.export-opt .opt-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.modal-ft {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-2);
}
.modal-ft .btn { height: 32px; padding: 0 14px; font-size: 12px; font-weight: 600; border-radius: 999px; }

/* 表格容器横向滚动（移动端宽表） */
.card-bd { -webkit-overflow-scrolling: touch; }
.table-wrap {
  width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
}

@media (max-width: 1200px) {
  .layout { grid-template-columns: minmax(180px, 0.6fr) minmax(280px, 1.25fr) minmax(0, 1.35fr); }
  .brand .sub { display: none; }
  .tab-btn { padding: 6px 12px; font-size: 12px; }
}
@media (max-width: 960px) {
  body { height: auto; min-height: 100vh; min-height: 100dvh; overflow: auto; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .layout {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(180px, 30vh) minmax(300px, 48vh);
  }
  #event-card { grid-column: 1 / -1; }
  .top-main { gap: 8px; }
  .toolbar { width: 100%; justify-content: flex-start; }
  .menu-panel { right: 0; left: auto; width: min(420px, calc(100vw - 16px)); }
}
@media (max-width: 640px) {
  body {
    padding: 0 8px max(8px, env(safe-area-inset-bottom));
    height: auto; min-height: 100vh; min-height: 100dvh; overflow: auto;
  }
  .app-nav {
    margin: 0 -8px 8px;
    padding: 0 8px;
    padding-top: env(safe-area-inset-top);
  }
  .app-nav-inner { height: 40px; gap: 10px; }
  .app-logo { font-size: 13px; }
  .app-nav-link { height: 28px; padding: 0 10px; font-size: 11px; }

  .top { margin-bottom: 8px; }
  .top-main {
    flex-direction: column; align-items: stretch; gap: 8px;
  }
  .brand { justify-content: space-between; }
  .brand h1 { font-size: 16px; }
  .toolbar {
    --tb-h: 32px;
    --tb-fs: 12px;
    width: 100%;
    border-radius: 12px;
    padding: 6px;
    gap: 6px;
  }
  .date-nav { flex: 1 1 auto; min-width: 0; }
  .date-nav select.nav-ctl { min-width: 0; flex: 1; max-width: 130px; }
  .date-nav input[type=date].nav-ctl {
    min-width: 0; width: 118px; flex: 0 0 auto; padding: 0 6px;
  }
  .day-badge { padding: 0 8px; font-size: 11px; }
  .status { display: none; }
  .menu-panel {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0;
    width: 100%; max-height: min(78vh, 640px);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 32px rgba(15, 23, 42, .18);
    overflow: auto;
  }
  #prompt-text { min-height: 140px; }

  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: none;
    gap: 8px;
  }
  #event-card,
  #block-card,
  #stock-card {
    grid-column: auto;
    min-height: 0;
  }
  #event-card { min-height: 200px; max-height: 36vh; }
  #block-card { min-height: 240px; max-height: 48vh; }
  #stock-card { min-height: 280px; max-height: none; }

  .card-hd {
    padding: 8px 10px; font-size: 12px; gap: 6px; flex-wrap: wrap;
  }
  .card-hd .meta { font-size: 10px; padding: 2px 6px; }
  .tab-switch {
    flex: 1 1 auto; min-width: 0; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tab-switch::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1 0 auto; padding: 6px 10px; font-size: 12px;
    white-space: nowrap;
  }
  .card-bd { overflow: auto; -webkit-overflow-scrolling: touch; }
  .filter-bar { padding: 6px 8px; gap: 4px; }
  .chip { padding: 4px 10px; font-size: 11px; min-height: 28px; }

  table { font-size: 12px; min-width: 100%; }
  th, td { padding: 8px 8px; }
  th { font-size: 11px; }
  .reason { max-width: 72px; }
  .num { font-size: 12px; }
  .tag { font-size: 10px; padding: 1px 5px; }

  /* 涨停/炸板宽表：横向滚动，核心列优先可见 */
  #block-panel table { min-width: 560px; }
  #stock-panel table { min-width: 0; width: 100%; }
  #stock-panel th { width: 84px; white-space: nowrap; }
  #stock-panel td { word-break: break-word; white-space: normal; }

  .ev-item { padding: 10px 8px; }
  .ev-title { font-size: 13px; -webkit-line-clamp: 3; }
  .ev-dir { max-width: 72px; font-size: 10px; }
  .ev-heat { min-width: 40px; font-size: 11px; }

  .stock-detail.open {
    position: fixed;
    inset: 0;
    z-index: 50;
    height: 100%;
    height: 100dvh;
    border-radius: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .stock-detail-hd {
    padding: 8px 10px; gap: 6px; flex-wrap: wrap;
  }
  .stock-detail-back { height: 32px; padding: 0 12px; }
  .stock-detail-nav { width: 100%; order: 3; flex: 1 1 100%; }
  .stock-detail-select { max-width: none; flex: 1; height: 32px; font-size: 12px; }
  .stock-detail-nav-btn { width: 32px; height: 32px; }
  .stock-detail-ext { width: 32px; height: 32px; }
  .stock-detail-bd { flex: 1; min-height: 0; }

  .scroll-more { padding: 14px 10px; font-size: 12px; }
  .msg { margin: 10px; font-size: 12px; }
  .msg.loading { padding: 28px 10px; }
}
@media (max-width: 380px) {
  .day-badge { display: none; }
  .date-nav input[type=date].nav-ctl { width: 108px; }
  .brand h1 { font-size: 15px; }
  #block-card { max-height: 44vh; }
  #event-card { max-height: 32vh; }
  .tab-btn { padding: 6px 8px; font-size: 11px; }
}

/* —— skeleton —— */
.skel {
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.skel-row {
  height: 14px; border-radius: 6px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: skel-shine 1.2s ease-in-out infinite;
}
.skel-row.lg { height: 18px; width: 60%; }
.skel-row.sm { height: 12px; width: 40%; }
@keyframes skel-shine {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* —— toast —— */
.toast-wrap {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: #0f172a; color: #f8fafc; font-size: 13px; font-weight: 500;
  padding: 10px 16px; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(15,23,42,.25);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
  max-width: min(360px, calc(100vw - 32px));
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok { background: #065f46; }
.toast.err { background: #991b1b; }

/* —— card tools —— */
.card-hd .hd-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.btn-mini {
  height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
}
.btn-mini:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.btn-mini.primary { background: var(--primary); color: #fff; border-color: transparent; }
.btn-mini.primary:hover { filter: brightness(.96); color: #fff; }

/* event collapse */
.event-card-collapsed .card-bd { display: none; }
.event-card-collapsed { flex: 0 0 auto !important; min-height: 0 !important; }
#event-toggle {
  height: 24px; width: 24px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
}
#event-toggle:hover { color: var(--primary); border-color: var(--primary); }

/* —— scrollbars —— */
* {
  scrollbar-width: thin;
  scrollbar-color: #475569 transparent;
}
*::-webkit-scrollbar {
  width: 8px; height: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background: #475569;
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: #64748b;
  border: 2px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-corner {
  background: transparent;
}
html.light * { scrollbar-color: #94a3b8 transparent; }
html.light *::-webkit-scrollbar-thumb { background: #94a3b8; }
html.light *::-webkit-scrollbar-thumb:hover { background: #64748b; }


/* B · light mode residual fixes */
html.light .switch-ui { background: #cbd5e1; }
html.light .switch input:checked + .switch-ui { background: var(--primary); }
html.light * { scrollbar-color: #94a3b8 transparent; }
html.light .btn { color: #fff; }
html.light .btn.ghost { color: var(--text); }
html.light .load-btn.primary { color: #fff; }

/* dark mode (legacy overrides; theme via :root / html.light) */
html.dark {
  color-scheme: dark;
  --bg: #0b1220;
  --card: #151d2e;
  --text: #e8eef7;
  --muted: #8b9bb4;
  --border: #2a3548;
  --hover: #1c2738;
  --primary: #60a5fa;
  --accent: #a78bfa;
  --up: #f87171;
  --down: #4ade80;
  --warn-bg: #3b2a0a;
  --warn-bd: #854d0e;
  --warn-fg: #fde68a;
  --err-bg: #3f1212;
  --err-fg: #fca5a5;
  --surface-2: #1a2333;
  --surface-3: #0f1624;
  --chip-bg: #1a2333;
  --input-bg: #0f1624;
}
html.dark * {
  scrollbar-color: #475569 transparent;
}
html.dark *::-webkit-scrollbar-track {
  background: transparent;
}
html.dark *::-webkit-scrollbar-thumb {
  background: #475569;
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
html.dark *::-webkit-scrollbar-thumb:hover {
  background: #64748b;
  border: 2px solid transparent;
  background-clip: padding-box;
}
html.dark *::-webkit-scrollbar-corner {
  background: transparent;
}

html.dark body { background: var(--bg); color: var(--text); }

/* surfaces */
html.dark .app-nav,
html.dark .card,
html.dark .toolbar,
html.dark .menu-panel,
html.dark .modal,
html.dark .stock-detail {
  background: var(--card);
  border-color: var(--border);
  color: var(--text);
  box-shadow: none;
}
html.dark .app-nav { border-bottom-color: var(--border); }
html.dark .card-hd,
html.dark .stock-detail-hd,
html.dark .filter-bar,
html.dark .menu-tabs,
html.dark th,
html.dark .modal-hd,
html.dark .modal-ft,
html.dark .pool-detail-tabs {
  background: var(--surface-2) !important;
  border-color: var(--border) !important;
  color: var(--text);
}
html.dark .card-hd .meta,
html.dark .status {
  background: var(--surface-3) !important;
  color: var(--muted) !important;
  border-color: var(--border) !important;
}

/* text */
html.dark .app-logo,
html.dark .brand h1,
html.dark .tab-btn.active,
html.dark b,
html.dark .stock-link {
  color: var(--text);
}
html.dark .brand .sub,
html.dark .app-nav-link,
html.dark .tab-btn,
html.dark .menu-tab,
html.dark .menu-hint,
html.dark .code,
html.dark .reason,
html.dark .page-info,
html.dark .scroll-more,
html.dark .footer-note,
html.dark .label,
html.dark .menu-pane label {
  color: var(--muted);
}
html.dark .stock-link:hover,
html.dark .code.stock-link:hover {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* nav / tabs */
html.dark .app-nav-link:hover,
html.dark .app-nav-link.active {
  background: #1e3a5f;
  color: #93c5fd;
  border-color: #3b82f6;
}
html.dark .tab-switch { background: var(--surface-3); }
html.dark .tab-btn { color: var(--muted); }
html.dark .tab-btn.active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
html.dark .tab-btn:hover:not(.active) { color: var(--text); }
html.dark .menu-tab:hover { color: var(--text); background: var(--card); }
html.dark .menu-tab.active {
  color: var(--primary);
  background: var(--card);
  box-shadow: inset 0 -2px 0 var(--primary);
}

/* buttons & controls */
html.dark .btn {
  color: #fff;
}
html.dark .btn.ghost,
html.dark .btn-mini,
html.dark .chip,
html.dark .nav-ctl,
html.dark .stock-detail-back,
html.dark .stock-detail-select,
html.dark .stock-detail-nav-btn,
html.dark .stock-detail-ext,
html.dark #event-toggle,
html.dark .date-nav button.nav-ctl,
html.dark .date-nav select.nav-ctl,
html.dark .date-nav input[type=date].nav-ctl {
  background: var(--input-bg) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}
html.dark .btn.ghost:hover,
html.dark .btn-mini:hover,
html.dark .chip:hover,
html.dark .nav-ctl:hover,
html.dark .stock-detail-back:hover,
html.dark .stock-detail-nav-btn:hover,
html.dark .stock-detail-ext:hover,
html.dark #event-toggle:hover,
html.dark .date-nav button.nav-ctl:not(:disabled):hover {
  background: #1e3a5f !important;
  color: #93c5fd !important;
  border-color: #3b82f6 !important;
}
html.dark .chip.active,
html.dark .btn.ghost.active {
  background: #1e3a5f !important;
  color: #93c5fd !important;
  border-color: #3b82f6 !important;
}
html.dark .btn.export { background: var(--accent); color: #fff; }
html.dark .btn:disabled,
html.dark .nav-ctl:disabled,
html.dark .stock-detail-nav-btn:disabled {
  opacity: .4;
  color: var(--muted) !important;
}

/* form fields inside settings */
html.dark .menu-pane select,
html.dark .menu-pane input,
html.dark .menu-pane textarea,
html.dark #prompt-text {
  background: var(--input-bg) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
  caret-color: var(--text);
}
html.dark .menu-pane select option {
  background: var(--card);
  color: var(--text);
}
html.dark input[type=date]::-webkit-calendar-picker-indicator {
  filter: invert(0.85);
}

/* tables */
html.dark th {
  color: var(--muted) !important;
  border-bottom-color: var(--border) !important;
}
html.dark th.sortable:hover {
  color: var(--primary) !important;
  background: #1e3a5f !important;
}
html.dark th.sortable.asc,
html.dark th.sortable.desc {
  color: var(--primary) !important;
  background: #1e3a5f !important;
  box-shadow: inset 0 -2px 0 var(--primary);
}
html.dark td {
  border-bottom-color: var(--border);
  color: var(--text);
}
html.dark #block-panel tbody tr:hover td,
html.dark #stock-panel tbody tr:hover td {
  background: var(--hover);
}
html.dark #block-panel tbody tr.active td,
html.dark #stock-panel tbody tr.active td {
  background: #1e3a5f;
  border-bottom-color: #3b82f6;
}
html.dark #block-panel tbody tr.active td:first-child,
html.dark #stock-panel tbody tr.active td:first-child {
  color: #93c5fd;
  box-shadow: inset 3px 0 0 #3b82f6;
}
html.dark #block-panel tbody tr.active:hover td,
html.dark #stock-panel tbody tr.active:hover td {
  background: #243b5c;
}

/* tags */
html.dark .tag {
  background: var(--chip-bg);
  color: var(--muted);
}
html.dark .tag.first { background: #3f1212; color: #fca5a5; }
html.dark .tag.back { background: #052e1c; color: #6ee7b7; }
html.dark .tag.down { background: #052e1c; color: #6ee7b7; }

/* events */
html.dark .ev-item:hover { background: var(--hover); }
html.dark .ev-item + .ev-item { border-top-color: var(--border); }
html.dark .ev-title { color: var(--text); }
html.dark .ev-stock { color: var(--muted); }
html.dark .ev-stock b { color: var(--text); }
html.dark .ev-heat { background: #3f1212; color: #fca5a5; }
html.dark .ev-heat.mid { background: #3b2a0a; color: #fdba74; }
html.dark .ev-heat.low { background: var(--chip-bg); color: var(--muted); }
html.dark .ev-dir {
  background: #1e3a5f;
  color: #93c5fd;
  border-color: #3b82f6;
}

/* detail / loading */
html.dark .msg.loading,
html.dark .stock-detail-loading {
  background: var(--card);

## 角色设定
你是一位拥有10年以上A股实战经验的顶级短线题材策略分析师，专精于主题投资、情绪周期和资金行为分析。

## 任务目标
针对用户提供的某一爆发题材（如商业航天/低空经济/AI）的涨停板名单，进行深度复盘，将个股进行分类分层，识别真伪龙头，并给出下一个交易日的推演预期。

**最终输出要求**：你必须生成一份**完整的、自包含的 HTML 文档**（所有 CSS 内联在 <style> 标签中），以报告形式清晰呈现所有分析结论。该 HTML 应设计为适合直接截图或打印的样式，无需任何外部资源。

## 输入数据要求
用户将提供该题材的**核心事件驱动逻辑**（一句话概括）以及当日或近期**涨停个股完整名单**（需包含：代码、名称、涨幅、连板数、封板时间、核心涨停概念标签）。

---

## 分析路径与思维链（Chain of Thought）
请严格按照以下步骤进行推理分析（思考过程不输出，仅输出最终结论，但结论必须基于以下逻辑）：

### 第一步：定性板块生命周期（板块阶段判断）
- 判断该板块目前处于行情的哪个阶段：**爆发首日**、**高潮次日（分化日）**、**主升加速**、还是**退潮初期**？
- 观察当日全市场封板率，判断资金整体做多情绪是否存在分歧。

### 第二步：多维定位个股（核心分类框架）
对名单中的每一只个股，从以下**5个核心维度**进行切割归类：

1. **产业链地位维度**：上游（材料/元器件）、中游（核心制造/总装）、下游（应用/运营）。谁最不可或缺？
2. **资金地位与市值维度（股性）**：
   - **中军**（大市值、机构重仓、成交额巨大，机构+游资合力）
   - **情绪先锋**（小市值、换手率极高、率先封板，游资主导）
   - **弹性套利**（创业板/科创板小市值，量化+短线）
   - **后排补涨**（逻辑牵强、启动最晚、封板不坚决，散户跟风）
3. **逻辑纯正度维度（真假概念）**：
   - **核心正宗**（实锤公告参与核心环节）
   - **产业链配套**（供应商但非核心）
   - **概念叠加/擦边**（历史关联或模糊标签）
   - **纯情绪标签**（名字、地域、无关业务硬挖）
4. **日内启动时间与筹码结构**：
   - 竞价/开盘秒板（9:30前）：最强
   - 上午共振板（10:00-11:30）：中坚
   - 午后直线板（13:00-13:30）：跟风
   - 尾盘偷袭板（14:30后）：⚠️警惕
5. **业绩与历史瑕疵**：是否有财报预增/扭亏？是否有立案、违规、高管变动？

### 第三步：建立分层梯队（金字塔结构）
综合第二步，将所有个股划分为以下**五个梯队**：
- **第一梯队（核心中军）**：大市值、高成交，板块风向标。
- **第二梯队（核心硬件/关键环节）**：与突破技术直接物理相关，逻辑最硬，易出真龙头。
- **第三梯队（上游稀缺资源/卖铲人）**：受益于放量，业绩可兑现。
- **第四梯队（应用/泛产业链延伸）**：陪跑共振，数量最多，淘汰最烈。
- **第五梯队（边缘蹭热点）**：主业完全无关，退潮时率先A杀。

### 第四步：异常信号诊断（预期差识别）
- **该强不强**（高危）：核心票连续尾盘板或烂板，存在被卡位风险。
- **该弱不弱**（强势）：逻辑正且早盘硬板，可能是真龙。

### 第五步：推演下一个交易日预期

  async function fetchJsonOnce(fullUrl) {
    const res = await fetch(fullUrl, {
      method: 'GET',
      mode: 'cors',
      credentials: 'omit',
      headers: { Accept: 'application/json, text/plain, */*' },
    });
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (_) {
      // some proxies wrap as { contents: "..." }
      try {
        const wrap = JSON.parse(text);
        if (wrap && typeof wrap.contents === 'string') return JSON.parse(wrap.contents);
      } catch (__) {}
      throw new Error('响应不是 JSON');
    }
  }

  async function getJson(url, opts = {}) {
    const { retryProxy = false } = opts;
    const list = retryProxy ? proxyCandidates(url) : [proxyWrap(url)];
    let lastErr = null;
    for (const full of list) {
      try {
        return await fetchJsonOnce(full);
      } catch (e) {
        lastErr = e;
        // only continue when auto-retrying proxies
        if (!retryProxy) break;
        if (e.status && e.status !== 403 && e.status !== 429 && e.status < 500) break;
      }
    }
    throw lastErr || new Error('请求失败');
  }

    const isTrade = data.trade_day === true;
    const map = {};
    prev.forEach((d) => { map[d] = true; });
    next.forEach((d) => { map[d] = true; });
    map[seed] = isTrade;
    const dates = [...new Set([...prev, ...next, ...(isTrade ? [seed] : [])])].sort();
    return { dates, isTrade, map };
  }
