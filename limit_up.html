      const active = b.index === state.selected ? ' class="active"' : '';
      html += `<tr data-idx="${b.index}"${active}>
        <td><b>${esc(b.name)}</b></td>
        <td class="num">${b.limitUpNum}</td>
        <td class="num">${b.continuousPlateNum}</td>
        <td>${esc(b.high)}</td>
        <td class="num up">${esc(fmtPct(b.change))}</td>
      </tr>`;
    });
    html += `</tbody></table>${rawToggleHtml('raw-block')}`;
    panel.innerHTML = html;

    const raw = $('raw-block');
    if (raw && state.rawBlock) raw.textContent = JSON.stringify(state.rawBlock, null, 2);

    panel.querySelectorAll('tbody tr').forEach((tr) => {
      tr.addEventListener('click', () => selectBlock(Number(tr.dataset.idx)));
    });
    panel.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (state.blockSort.key === key) {
          state.blockSort.dir = state.blockSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          state.blockSort = { key, dir: key === 'name' || key === 'high' ? 'asc' : 'desc' };
        }
        renderBlocks();
      });
    });
    bindRawToggle(panel);
  }

  function poolMeta(kind) {
    return POOL_KINDS[kind] || POOL_KINDS.limitUp;
  }

  function poolTotalHint(kind, d, chunkLen) {
    if (kind === 'limitUp') return d.page?.total ?? d.limit_up_count?.today?.num ?? chunkLen;
    if (kind === 'openLimit') return d.page?.total ?? d.limit_up_count?.today?.open_num ?? chunkLen;
    if (kind === 'limitDown') return d.page?.total ?? d.limit_down_count?.today?.num ?? chunkLen;
    return d.page?.total ?? chunkLen;
  }

  async function loadPoolList(kind, page, append = false) {
    const meta = poolMeta(kind);
    const loadingKey = meta.loadingKey;
    const dataKey = meta.dataKey;
    const label = meta.label;
    const apiFn = meta.api;
    const panel = els.blockPanel;
    if (!state.date || state[loadingKey]) return;
    const p = page || 1;
    state[loadingKey] = true;
    if (!append) {
      panel.innerHTML = msgHtml('loading', `加载${label}数据...`);
      els.blockMeta.textContent = '';
      state[dataKey] = null;

      // 历史日 / 当日收盘后：仅当缓存写入时间 ≥ 当日 15:00 才直接用
      if (isFrozenDate(state.date)) {
        const cached = loadPoolCache(kind, state.date, { requireFrozen: true });
        if (cached && Array.isArray(cached.list) && cached.list.length) {
          state[dataKey] = {
            list: cached.list,
            total: cached.total ?? cached.list.length,
            page: cached.page || 1,
            raw: cached.raw || null,
          };
          renderPoolSideList(kind, { openFirst: true });
          setStatus(state.date === state.today
            ? `缓存 ${fmtDate(state.date)} (15:00后)`
            : `缓存 ${fmtDate(state.date)}`);
          state[loadingKey] = false;
          return;
        }
      }
    } else {
      const tip = panel.querySelector('.scroll-more');
      if (tip) tip.textContent = '加载中...';
    }
    try {
      const url = apiFn(state.date, p, 30);
      const json = await getJson(url, { retryProxy: true });
      const d = json?.data || {};
      const chunk = Array.isArray(d.info) ? d.info : [];
      const total = poolTotalHint(kind, d, chunk.length);
      if (append && state[dataKey]) {
        const seen = new Set(state[dataKey].list.map((x) => String(x.code || '')));
        chunk.forEach((item) => {
          const c = String(item.code || '');
          if (c && !seen.has(c)) {
            seen.add(c);
            state[dataKey].list.push(item);
          }
        });
        state[dataKey].total = total;
        state[dataKey].page = p;
      } else {
        state[dataKey] = { list: chunk, total, page: p, raw: json };
      }
      // 收盘后/历史日写入（savedAt 用于校验是否 15:00 后）
      if (isFrozenDate(state.date) && state[dataKey]) {
        savePoolCache(kind, state.date, {
          list: state[dataKey].list,
          total: state[dataKey].total,
          page: state[dataKey].page,
          raw: state[dataKey].raw || json,
        });
      }
      renderPoolSideList(kind, { openFirst: !append });
    } catch (e) {
      if (!append) {
        // 网络失败：任意缓存兜底
        const cached = loadPoolCache(kind, state.date, { requireFrozen: false, allowAny: true });
        if (cached && Array.isArray(cached.list) && cached.list.length) {
          state[dataKey] = {
            list: cached.list,
            total: cached.total ?? cached.list.length,
            page: cached.page || 1,
            raw: cached.raw || null,
          };
          renderPoolSideList(kind, { openFirst: true });
          setStatus(`缓存 ${fmtDate(state.date)} (网络不可用)`);
        } else {
          panel.innerHTML = msgHtml('error', `${label}请求失败: ${e.message}`);
        }
      } else {
        const tip = panel.querySelector('.scroll-more');
        if (tip) tip.textContent = '加载失败，继续滚动重试';
      }
    } finally {
      state[loadingKey] = false;
    }
  }

  function loadOpenLimitPool(page, append = false) {
    return loadPoolList('openLimit', page, append);
  }

  function loadLimitUpPool(page, append = false) {
    return loadPoolList('limitUp', page, append);
  }

  function loadLimitDownPool(page, append = false) {
    return loadPoolList('limitDown', page, append);
  }

  function fmtMoney(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) return '-';
    if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 1 : 2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + '万';
    return String(Math.round(n));
  }

  function getVal(obj, keys) {
    if (!obj) return null;
    for (const k of keys) {
      if (obj[k] != null && obj[k] !== '') return obj[k];
    }
    return null;
  }

  function getPoolState(kind) {
    return state[poolMeta(kind).dataKey];
  }

  function poolLabel(kind) {
    return poolMeta(kind).label;
  }

  function fmtSucRate(v) {
    if (v == null || v === '') return '-';
    const n = Number(v);
    if (!Number.isFinite(n)) return '-';
    // API 可能是 0~1 或已是百分比
    return fmtPct(n <= 1 ? n * 100 : n);
  }

  function fmtPreview(arr) {
    if (!Array.isArray(arr) || !arr.length) return '-';
    return arr.map((x) => {
      const n = Number(x);
      return Number.isFinite(n) ? n.toFixed(2) + '%' : String(x);
    }).join(' / ');
  }

  function poolItemTagsHtml(s) {
    const tags = [];
    const changeTag = getVal(s, ['change_tag']) || '';
    const ct = CHANGE_TAG[changeTag];
    const limitType = getVal(s, ['limit_up_type']) || '';
    const mkt = getVal(s, ['market_type']) || '';
    const mktLabel = MARKET[mkt] || mkt;
    if (ct) tags.push(`<span class="tag ${ct.cls}">${esc(ct.label)}</span>`);
    if (limitType) tags.push(`<span class="tag">${esc(limitType)}</span>`);
    if (Number(getVal(s, ['is_again_limit']) || 0) === 1) tags.push('<span class="tag back">回封</span>');
    if (Number(getVal(s, ['is_new']) || 0) === 1) tags.push('<span class="tag">新</span>');
    if (mktLabel) tags.push(`<span class="tag">${esc(mktLabel)}</span>`);
    return tags.join('') || '-';
  }

  function renderPoolSideList(kind, opts = {}) {
    const { openFirst = true } = opts;
    const panel = els.blockPanel;
    const raw = getPoolState(kind);
    const list = raw?.list;
    const label = poolLabel(kind);
    if (!Array.isArray(list) || !list.length) {
      panel.innerHTML = msgHtml('warn', `当日无${label}数据`);
      els.blockMeta.textContent = '0 只';
      closeStockDetail();
      els.tagFilters.hidden = true;
      els.stockPanel.innerHTML = msgHtml('loading', `无${label}个股`);
      els.stockMeta.textContent = '';
      state.stockNavList = [];
      return;
    }
    const total = raw.total ?? list.length;
    const page = raw.page || 1;
    const hasMore = list.length < total;
    els.blockMeta.textContent = `${list.length}/${total} 只`;
    state.stockNavList = list.map((s) => ({
      code: String(getVal(s, ['code']) || ''),
      name: String(getVal(s, ['name']) || ''),
    })).filter((s) => s.code);

    if (state.poolSelected < 0 || state.poolSelected >= list.length) {
      state.poolSelected = 0;
    }

    const scrollTop = panel.scrollTop;
    let html = kind === 'limitUp'
      ? `<table><thead><tr>
          <th>代码</th><th>名称</th><th>最新</th><th>涨幅</th><th>连板</th>
          <th>封单</th><th>换手</th><th>首次封板</th><th>类型</th>
        </tr></thead><tbody>`
      : kind === 'limitDown'
        ? `<table><thead><tr>
            <th>代码</th><th>名称</th><th>最新</th><th>跌幅</th><th>换手</th>
            <th>流通市值</th><th>市场</th><th>标签</th>
          </tr></thead><tbody>`
        : `<table><thead><tr>
            <th>代码</th><th>名称</th><th>最新</th><th>炸板涨幅</th><th>炸板次数</th>
            <th>首次涨停</th><th>换手</th><th>市场</th>
          </tr></thead><tbody>`;

    list.forEach((s, i) => {
      const code = String(getVal(s, ['code']) || '');
      const name = String(getVal(s, ['name']) || '');
      const price = getVal(s, ['latest']) || '-';
      const rate = getVal(s, ['change_rate']);
      const rateNum = rate != null ? Number(rate) : NaN;
      const rateCls = Number.isFinite(rateNum) ? (rateNum >= 0 ? 'up' : 'down') : '';
      const active = i === state.poolSelected ? ' class="active"' : '';
      if (kind === 'limitUp') {
        const highDays = getVal(s, ['high_days']) || '-';
        const orderAmt = getVal(s, ['order_amount']);
        const turn = getVal(s, ['turnover_rate']);
        const firstTs = getVal(s, ['first_limit_up_time']);
        const limitType = getVal(s, ['limit_up_type']) || '';
        const changeTag = getVal(s, ['change_tag']) || '';
        const ct = CHANGE_TAG[changeTag];
        const tags = [];
        if (ct) tags.push(`<span class="tag ${ct.cls}">${esc(ct.label)}</span>`);
        if (limitType) tags.push(`<span class="tag">${esc(limitType)}</span>`);
        html += `<tr data-pool-idx="${i}"${active}>
          <td class="code">${esc(code)}</td>
          <td><b>${esc(name)}</b></td>
          <td class="num">${esc(String(price))}</td>
          <td class="num ${rateCls}">${rate != null ? fmtPct(rate) : '-'}</td>
          <td>${esc(String(highDays))}</td>
          <td class="num">${esc(fmtMoney(orderAmt))}</td>
          <td class="num">${turn != null ? fmtPct(turn) : '-'}</td>
          <td class="num">${esc(fmtTime(firstTs))}</td>
          <td>${tags.join('') || '-'}</td>
        </tr>`;
      } else if (kind === 'limitDown') {
        const turn = getVal(s, ['turnover_rate']);
        const currency = getVal(s, ['currency_value']);
        const mkt = getVal(s, ['market_type']) || '';
        const mktLabel = MARKET[mkt] || mkt || '-';
        const changeTag = getVal(s, ['change_tag']) || 'LIMIT_DOWN';
        const ct = CHANGE_TAG[changeTag] || CHANGE_TAG.LIMIT_DOWN;
        html += `<tr data-pool-idx="${i}"${active}>
          <td class="code">${esc(code)}</td>
          <td><b>${esc(name)}</b></td>
          <td class="num">${esc(String(price))}</td>
          <td class="num ${rateCls}">${rate != null ? fmtPct(rate) : '-'}</td>
          <td class="num">${turn != null ? fmtPct(turn) : '-'}</td>
          <td class="num">${esc(fmtMoney(currency))}</td>
          <td>${esc(mktLabel)}</td>
          <td><span class="tag ${ct.cls}">${esc(ct.label)}</span></td>
        </tr>`;
      } else {
        const openNum = getVal(s, ['open_num']) ?? '-';
        const firstTs = getVal(s, ['first_limit_up_time']);
        const turn = getVal(s, ['turnover_rate']);
        const mkt = getVal(s, ['market_type']) || '';
        const mktLabel = MARKET[mkt] || mkt || '-';
        html += `<tr data-pool-idx="${i}"${active}>
          <td class="code">${esc(code)}</td>
          <td><b>${esc(name)}</b></td>
          <td class="num">${esc(String(price))}</td>
          <td class="num ${rateCls}">${rate != null ? fmtPct(rate) : '-'}</td>
          <td class="num">${esc(String(openNum))}</td>
          <td class="num">${esc(fmtTime(firstTs))}</td>
          <td class="num">${turn != null ? fmtPct(turn) : '-'}</td>
          <td>${esc(mktLabel)}</td>
        </tr>`;
      }
    });
    html += '</tbody></table>';
    if (hasMore) {
      html += `<div class="scroll-more">上拉加载更多 · 第 ${page} 页</div>`;
    } else {
      html += `<div class="scroll-more">已加载全部 ${total} 只</div>`;
    }
    panel.innerHTML = html;
    panel.scrollTop = scrollTop;
    panel.querySelectorAll('tbody tr').forEach((tr) => {
      tr.addEventListener('click', () => {
        const idx = Number(tr.dataset.poolIdx);
        if (!Number.isFinite(idx)) return;
        if (idx === state.poolSelected) {
          renderPoolStockDetail(kind);
          return;
        }
        state.poolSelected = idx;
        panel.querySelectorAll('tbody tr').forEach((r) => r.classList.toggle('active', Number(r.dataset.poolIdx) === idx));
        renderPoolStockDetail(kind);
      });
    });
    bindPoolScroll(kind);
    renderPoolStockDetail(kind, { openFirst });
  }

  function renderOpenLimitPool(opts = {}) {
    renderPoolSideList('openLimit', opts);
  }

  function renderLimitUpPool(opts = {}) {
    renderPoolSideList('limitUp', opts);
  }

  function renderLimitDownPool(opts = {}) {
    renderPoolSideList('limitDown', opts);
  }

  function buildPoolInfoTableHtml(s, code, name) {
    const price = getVal(s, ['latest']) || '-';
    const rate = getVal(s, ['change_rate']);
    const rateNum = rate != null ? Number(rate) : NaN;
    const rateCls = Number.isFinite(rateNum) ? (rateNum >= 0 ? 'up' : 'down') : '';
    const mkt = getVal(s, ['market_type']) || '';
    const mktLabel = MARKET[mkt] || mkt || '-';
    const changeTag = getVal(s, ['change_tag']) || '';
    const ct = CHANGE_TAG[changeTag];
    const limitType = getVal(s, ['limit_up_type']) || '';
    const highDays = getVal(s, ['high_days']);
    const highDaysVal = getVal(s, ['high_days_value']);
    const openNum = getVal(s, ['open_num']);
    const orderAmt = getVal(s, ['order_amount']);
    const orderVol = getVal(s, ['order_volume']);
    const turn = getVal(s, ['turnover_rate']);
    const firstTs = getVal(s, ['first_limit_up_time']);
    const lastTs = getVal(s, ['last_limit_up_time']);
    const sucRate = getVal(s, ['limit_up_suc_rate']);
    const currency = getVal(s, ['currency_value']);
    const reason = getVal(s, ['reason_type']);
    const marketId = getVal(s, ['market_id']);
    const isAgain = Number(getVal(s, ['is_again_limit']) || 0) === 1;
    const isNew = Number(getVal(s, ['is_new']) || 0) === 1;
    const preview = getVal(s, ['time_preview']);

    const rows = [
      ['代码', `<a class="code stock-link stock-code-link" href="${esc(stockPageUrl(code))}" data-code="${esc(code)}" data-name="${esc(name)}">${esc(code)}</a>`],
      ['名称', `<a class="stock-link stock-name-link" href="${esc(stockPageUrl(code))}" data-code="${esc(code)}" data-name="${esc(name)}"><b>${esc(name)}</b></a>`],
      ['最新价', esc(String(price))],
      ['涨跌幅', `<span class="${rateCls}">${rate != null ? fmtPct(rate) : '-'}</span>`],
      ['连板高度', esc(highDays != null && highDays !== '' ? String(highDays) : '-')],
      ['高度值', highDaysVal != null ? esc(String(highDaysVal)) : '-'],
      ['封板类型', esc(limitType || '-')],
      ['状态标签', ct ? `<span class="tag ${ct.cls}">${esc(ct.label)}</span>` : esc(changeTag || '-')],
      ['首次封板', esc(fmtTime(firstTs))],
      ['最后封板', esc(fmtTime(lastTs))],
      ['炸板次数', openNum != null && openNum !== '' ? esc(String(openNum)) : '-'],
      ['封单金额', esc(fmtMoney(orderAmt))],
      ['封单量', esc(fmtMoney(orderVol))],
      ['换手率', turn != null ? fmtPct(turn) : '-'],
      ['流通市值', esc(fmtMoney(currency))],
      ['封板成功率', fmtSucRate(sucRate)],
      ['是否回封', isAgain ? '是' : '否'],
      ['是否新股', isNew ? '是' : '否'],
      ['市场', esc(mktLabel)],
      ['市场ID', marketId != null ? esc(String(marketId)) : '-'],
      ['原因/题材', esc(reason || '-')],
      ['分时预览', esc(fmtPreview(preview))],
      ['标签', poolItemTagsHtml(s)],
    ];

    let html = `<table><tbody>`;
    rows.forEach(([k, v]) => {
      html += `<tr><th style="width:96px;text-align:left">${esc(k)}</th><td>${v}</td></tr>`;
    });
    html += `</tbody></table>`;
    return html;
  }

  function switchPoolDetailTab(tab) {
    if (tab !== 'kline' && tab !== 'info') return;
    state.poolDetailTab = tab;
    const root = els.stockPanel.querySelector('.pool-detail');
    if (!root) return;
    root.querySelectorAll('.pool-detail-tabs .tab-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    root.querySelectorAll('.pool-detail-pane').forEach((p) => {
      p.classList.toggle('active', p.dataset.pane === tab);
    });
    // 切到 K 线时确保 iframe 已加载
    if (tab === 'kline') {
      const iframe = root.querySelector('#pool-kline-frame');
      const code = iframe?.dataset.code;
      if (iframe && code) {
        const url = stockPageUrl(code);
        if (!iframe.src || iframe.src === 'about:blank' || !String(iframe.src).includes(code)) {
          iframe.src = url;
        }
      }
    }
  }

  function renderPoolStockDetail(kind) {
    const raw = getPoolState(kind);
    const list = raw?.list || [];
    const label = poolLabel(kind);
    const panel = els.stockPanel;
    els.tagFilters.hidden = true;
    els.tagFilters.innerHTML = '';
    closeStockDetail();

    if (!list.length) {
      state.stockNavList = [];
      panel.innerHTML = msgHtml('loading', `无${label}个股`);
      els.stockMeta.textContent = '';
      return;
    }

    const idx = Math.max(0, Math.min(state.poolSelected, list.length - 1));
    state.poolSelected = idx;
    const s = list[idx];
    const code = String(getVal(s, ['code']) || '');
    const name = String(getVal(s, ['name']) || '');
    state.stockNavList = list.map((x) => ({
      code: String(getVal(x, ['code']) || ''),
      name: String(getVal(x, ['name']) || ''),
    })).filter((x) => x.code);
    els.stockMeta.textContent = `${label} · ${name || code} · ${idx + 1}/${list.length}`;

    const tab = state.poolDetailTab === 'info' ? 'info' : 'kline';
    const pageUrl = stockPageUrl(code);
    const infoHtml = buildPoolInfoTableHtml(s, code, name);

    panel.innerHTML = `<div class="pool-detail">
      <div class="pool-detail-tabs">
        <div class="tab-switch" id="pool-detail-tabs">
          <button type="button" class="tab-btn ${tab === 'kline' ? 'active' : ''}" data-tab="kline">K线</button>
          <button type="button" class="tab-btn ${tab === 'info' ? 'active' : ''}" data-tab="info">详情</button>
        </div>
        <a class="stock-detail-ext" href="${esc(pageUrl)}" target="_blank" rel="noopener" title="新窗口打开" style="margin-left:auto">↗</a>
      </div>
      <div class="pool-detail-body">
        <div class="pool-detail-pane pane-kline ${tab === 'kline' ? 'active' : ''}" data-pane="kline">
          <iframe id="pool-kline-frame" title="K线 ${esc(code)}" data-code="${esc(code)}"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"
            ${tab === 'kline' ? `src="${esc(pageUrl)}"` : 'src="about:blank"'}></iframe>
        </div>
        <div class="pool-detail-pane pane-info ${tab === 'info' ? 'active' : ''}" data-pane="info">
          ${infoHtml}
        </div>
      </div>
    </div>`;

    const tabs = panel.querySelector('#pool-detail-tabs');
    if (tabs) {
      tabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.tab-btn');
        if (!btn || btn.classList.contains('active')) return;
        switchPoolDetailTab(btn.dataset.tab);
      });
    }
    bindStockLinks(panel.querySelector('.pane-info') || panel);
  }

  function bindPoolScroll(kind) {
    const panel = els.blockPanel;
    panel.onscroll = null;
    if (state.blockView !== kind) return;
    const meta = poolMeta(kind);
    const loadingKey = meta.loadingKey;
    const dataKey = meta.dataKey;
    panel.onscroll = () => {
      if (state.blockView !== kind || state[loadingKey]) return;
      const d = state[dataKey];
      if (!d || !d.list || d.list.length >= (d.total || 0)) return;
      if (panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 80) {
        loadPoolList(kind, (d.page || 1) + 1, true);
      }
    };
  }

  function renderStocks() {
    const panel = els.stockPanel;
    if (state.selected < 0 || !state.blocks[state.selected]) {
      state.stockNavList = [];
      els.tagFilters.hidden = true;
      panel.innerHTML = msgHtml('loading', '选择左侧板块查看个股');
      els.stockMeta.textContent = '';
      return;
    }

    const block = state.blocks[state.selected];
    const all = block.stocks;
    renderTagFilters(all);
    const filtered = filteredStocks(all);
    const rows = sortedStocks(filtered);
    state.stockNavList = rows.map((s) => ({ code: String(s.code || ''), name: s.name || '' }));
    els.stockMeta.textContent = `${block.name} · ${rows.length}/${all.length} 只`;

    if (!all.length) {
      state.stockNavList = [];
      panel.innerHTML = msgHtml('warn', '该板块无个股明细');
      return;
    }
    if (!rows.length) {
      state.stockNavList = [];
      panel.innerHTML = msgHtml('warn', '当前标签下无匹配个股');
      return;
    }

    let html = `<table><thead><tr>
      ${thSort('代码', 'code', state.stockSort)}
      ${thSort('名称', 'name', state.stockSort)}
      ${thSort('最新', 'latest', state.stockSort)}
      ${thSort('涨幅', 'changeRate', state.stockSort)}
      ${thSort('高度', 'high', state.stockSort)}
      ${thSort('首次封板', 'firstTime', state.stockSort)}
      ${thSort('最后封板', 'lastTime', state.stockSort)}
      <th>标签</th>
      ${thSort('原因', 'reasonType', state.stockSort)}
    </tr></thead><tbody>`;

    const activeCode = currentDetailCode();
    rows.forEach((s) => {
      const rateCls = s.changeRate >= 0 ? 'up' : 'down';
      const tagsHtml = s.tags.map((t) => {
        const ct = Object.values(CHANGE_TAG).find((x) => x.label === t);
        const cls = ct ? `tag ${ct.cls}` : 'tag';
        return `<span class="${cls}">${esc(t)}</span>`;
      }).join('');
      const title = esc((s.reasonInfo || s.reasonType || '').replace(/\n/g, ' '));
      const code = String(s.code || '');
      const isActive = activeCode && code === activeCode && els.stockDetail.classList.contains('open');
      html += `<tr data-code="${esc(code)}"${isActive ? ' class="active"' : ''}>
        <td class="code"><a class="code stock-link stock-code-link" href="${esc(stockPageUrl(code))}" data-code="${esc(code)}" data-name="${esc(s.name)}" title="点代码：${isTvOn() ? '新窗口 TradingView' : '面板内资料'}">${esc(code)}</a></td>
        <td><a class="stock-link stock-name-link" href="${esc(stockPageUrl(code))}" data-code="${esc(code)}" data-name="${esc(s.name)}" title="点名称：面板内同花顺资料">${esc(s.name)}</a></td>
        <td class="num">${esc(s.latest)}</td>
        <td class="num ${rateCls}">${esc(fmtPct(s.changeRate))}</td>
        <td>${esc(s.high)}</td>
        <td class="num">${esc(fmtTime(s.firstTime))}</td>
        <td class="num">${esc(fmtTime(s.lastTime))}</td>
        <td>${tagsHtml}</td>
        <td class="reason" title="${title}">${esc(s.reasonType || '')}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    panel.innerHTML = html;

    bindStockLinks(panel);

    panel.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (state.stockSort.key === key) {
          state.stockSort.dir = state.stockSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          const ascDefault = ['code', 'name', 'high', 'firstTime', 'lastTime', 'reasonType'].includes(key);
          state.stockSort = { key, dir: ascDefault ? 'asc' : 'desc' };
        }
        renderStocks();
      });
    });
  }

  function tvSymbol(code) {
    const c = String(code || '').replace(/\D/g, '');
    if (!c) return code;
    if (/^[695]/.test(c)) return `SSE:${c}`;
    if (/^[0123]/.test(c)) return `SZSE:${c}`;
    if (/^[48]/.test(c)) return `BSE:${c}`;
    return c;
  }

  /** 同花顺市场前缀：沪 17_ / 深 33_ / 其它 hs_ */
  function thsMarketPrefix(code) {
    const c = String(code || '').replace(/\D/g, '');
    if (!c) return '';
    // 沪市主板/科创/基金等
    if (/^6/.test(c) || /^5/.test(c) || /^9/.test(c)) return '17_';
    // 深市主板/中小/创业
    if (/^[023]/.test(c)) return '33_';
    // 北交所等
    return 'hs_';
  }

  function thsMobilePathCode(code) {
    const c = String(code || '').replace(/\D/g, '') || String(code || '');
    const p = thsMarketPrefix(c);
    return p ? `${p}${c}` : c;
  }

  function stockPageUrlDesktop(code) {
    const c = String(code || '').replace(/\D/g, '') || code;
    return `https://stockpage.10jqka.com.cn/${c}/`;
  }

  function stockPageUrlMobile(code) {
    const pathCode = thsMobilePathCode(code);
    return `https://m.10jqka.com.cn/stockpage/${pathCode}/`;
  }

  function isThsMobile() {
    if (els.thsPageVer) return els.thsPageVer.value !== 'desktop';
    return state.thsPageVer !== 'desktop';
  }

  function stockPageUrl(code) {
    return isThsMobile() ? stockPageUrlMobile(code) : stockPageUrlDesktop(code);
  }

  function loadThsPageVer() {
    try {
      const v = localStorage.getItem('limit_up_ths_page_ver');
      state.thsPageVer = (v === 'desktop') ? 'desktop' : 'mobile';
    } catch (_) { state.thsPageVer = 'mobile'; }
    if (els.thsPageVer) els.thsPageVer.value = state.thsPageVer;
  }

  function saveThsPageVer() {
    const v = els.thsPageVer ? els.thsPageVer.value : 'mobile';
    state.thsPageVer = v === 'desktop' ? 'desktop' : 'mobile';
    try { localStorage.setItem('limit_up_ths_page_ver', state.thsPageVer); } catch (_) {}
    // 已打开的详情按新版本重载
    const code = currentDetailCode();
    if (code && els.stockDetail.classList.contains('open')) {
      // 清缓存后重开
      const key = frameCacheKey(code, 'ths');
      const entry = frameCache.map.get(key);
      if (entry?.iframe) {
        entry.iframe.remove();
        frameCache.map.delete(key);
        frameCache.order = frameCache.order.filter((k) => k !== key);
      }
      openStockDetail(code, state.stockNavList[state.stockNavIndex]?.name || '');
    }
    showToast(state.thsPageVer === 'mobile' ? '已切换手机版个股页' : '已切换桌面版个股页', 'ok');
  }

  function stockTvUrl(code) {
    return `https://cn.tradingview.com/chart/?symbol=${encodeURIComponent(tvSymbol(code))}`;
  }

  function isTvOn() {
    // 以 checkbox 实时状态为准，避免 state 不同步
    if (els.tvToggle) return !!els.tvToggle.checked;
    return !!state.useTradingView;
  }

  function stockCodeHref(code) {
    return isTvOn() ? stockTvUrl(code) : stockPageUrl(code);
  }

  function bindStockLinks(panel) {
    panel.querySelectorAll('a.stock-code-link').forEach((a) => {
      const code = a.dataset.code;
      a.href = stockCodeHref(code);
      a.target = isTvOn() ? '_blank' : '_self';
      a.rel = 'noopener';
      a.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        // TV 禁止 iframe，开关开只能新窗口；关则面板内资料
        if (isTvOn()) {
          window.open(stockTvUrl(code), '_blank', 'noopener');
        } else {
          openStockDetail(code, a.dataset.name, { mode: 'ths' });
        }
      });
    });
    panel.querySelectorAll('a.stock-name-link').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        // 名字始终面板内打开资料
        openStockDetail(a.dataset.code, a.dataset.name, { mode: 'ths' });
      });
    });
  }

  function refreshCodeLinkHrefs() {
    document.querySelectorAll('a.stock-code-link').forEach((a) => {
      if (a.dataset.code) a.href = stockCodeHref(a.dataset.code);
    });
  }

  function loadTvSetting() {
    try {
      state.useTradingView = localStorage.getItem('limit_up_use_tv') === '1';
    } catch (_) {
      state.useTradingView = false;
    }
    if (els.tvToggle) els.tvToggle.checked = !!state.useTradingView;
  }

  function saveTvSetting() {
    state.useTradingView = isTvOn();
    try { localStorage.setItem('limit_up_use_tv', state.useTradingView ? '1' : '0'); } catch (_) {}
    refreshCodeLinkHrefs();
    if (els.stockDetail.classList.contains('open')) {
      syncDetailExtLink(currentDetailCode(), isTvOn() ? 'tv' : 'ths');
    }
  }

  // 个股详情 iframe 缓存：只缓存实际打开过的，最多 5 个，LRU 淘汰
  // key = `${mode}:${code}`  mode=ths|tv
  const FRAME_CACHE_MAX = 5;
  const frameCache = {
    order: [],
    map: new Map(),
  };
  let detailMode = 'ths'; // 当前详情模式

  function frameCacheKey(code, mode) {
    const ver = isThsMobile() ? 'm' : 'd';
    return `${mode || 'ths'}:${ver}:${code}`;
  }

  function touchCache(key) {
    frameCache.order = frameCache.order.filter((k) => k !== key);
    frameCache.order.push(key);
  }

  function evictFrameCache() {
    while (frameCache.order.length > FRAME_CACHE_MAX) {
      const old = frameCache.order.shift();
      const entry = frameCache.map.get(old);
      if (entry?.iframe) entry.iframe.remove();
      frameCache.map.delete(old);
    }
  }

  function hideAllFrames() {
    frameCache.map.forEach((entry) => {
      entry.iframe.classList.remove('active');
    });
  }

  function getOrCreateFrame(code, mode) {
    const key = frameCacheKey(code, mode);
    if (frameCache.map.has(key)) {
      touchCache(key);
      return frameCache.map.get(key);
    }
    const iframe = document.createElement('iframe');
    iframe.title = mode === 'tv' ? `TV ${code}` : `资料 ${code}`;
    // TV 需要更宽松 sandbox 才可能加载
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox');
    iframe.dataset.code = code;
    iframe.dataset.mode = mode;
    const entry = { iframe, loaded: false, key, mode, code };
    iframe.addEventListener('load', () => {
      if (!iframe.src || iframe.src === 'about:blank') return;
      entry.loaded = true;
      if (iframe.classList.contains('active')) {
        clearDetailLoadTimer();
        setDetailLoadingUI(false);
      }
    });
    els.stockDetailBd.appendChild(iframe);
    frameCache.map.set(key, entry);
    touchCache(key);
    evictFrameCache();
    return entry;
  }

  function showCachedFrame(code, mode) {
    hideAllFrames();
    const entry = getOrCreateFrame(code, mode);
    entry.iframe.classList.add('active');
    return entry;
  }

  function currentDetailCode() {
    const s = state.stockNavList[state.stockNavIndex];
    return s?.code || '';
  }

  function syncDetailExtLink(code, mode) {
    if (!code) {
      els.stockDetailExt.href = '#';
      els.stockDetailExt.title = '新窗口打开';
      return;
    }
    const m = mode || detailMode;
    if (m === 'tv') {
      els.stockDetailExt.href = stockTvUrl(code);
      els.stockDetailExt.title = '新窗口打开 TradingView';
    } else {
      els.stockDetailExt.href = stockPageUrl(code);
      els.stockDetailExt.title = '新窗口打开同花顺资料';
    }
  }

  function clearDetailLoadTimer() {
    if (state.detailLoadTimer) {
      clearTimeout(state.detailLoadTimer);
      state.detailLoadTimer = null;
    }
  }

  function setDetailLoadingUI(loading, timedOut = false) {
    const loadEl = els.stockDetailLoading;
    if (!loadEl) {
      els.stockDetail.classList.toggle('loading', loading);
      return;
    }
    const text = loadEl.querySelector('.load-text');
    const actions = loadEl.querySelector('.load-actions');
    if (loading) {
      els.stockDetail.classList.add('loading');
      if (text) text.textContent = timedOut ? '加载较慢或失败，可重试或新窗口打开' : '加载同花顺资料...';
      if (actions) actions.hidden = !timedOut;
      if (els.btnDetailNewwin) {
        const code = currentDetailCode();
        els.btnDetailNewwin.href = code ? stockPageUrl(code) : '#';
      }
    } else {
      els.stockDetail.classList.remove('loading');
      if (actions) actions.hidden = true;
    }
  }

  function highlightStockRow(code) {
    document.querySelectorAll('#stock-panel tbody tr[data-code]').forEach((tr) => {
      tr.classList.toggle('active', !!code && tr.dataset.code === code);
    });
    // 池子列表
    document.querySelectorAll('#block-panel tbody tr[data-pool-idx]').forEach((tr) => {
      // pool selected already handled via state.poolSelected
    });
  }

  // mode: 'ths' 资料(iframe) | 'tv' 图表(新窗口，TV 禁止嵌入)
  function openStockDetail(code, name, opts = {}) {
    if (!code) return;
    const mode = opts.mode === 'tv' ? 'tv' : 'ths';
    detailMode = mode;

    // TradingView 拒绝 iframe（X-Frame-Options），只能新窗口
    if (mode === 'tv') {
      window.open(stockTvUrl(code), '_blank', 'noopener');
      state.stockNavIndex = state.stockNavList.findIndex((s) => s.code === code);
      syncDetailExtLink(code, 'tv');
      return;
    }

    els.stockCard.style.display = '';
    state.stockNavIndex = state.stockNavList.findIndex((s) => s.code === code);
    const url = stockPageUrl(code);
    syncDetailExtLink(code, 'ths');
    els.stockListView.classList.add('hidden');
    els.stockDetail.classList.add('open');
    els.stockDetail.setAttribute('aria-hidden', 'false');
    highlightStockRow(code);

    const entry = showCachedFrame(code, 'ths');
    const needLoad = !entry.iframe.src || entry.iframe.src === 'about:blank'
      || !String(entry.iframe.src).includes(code);
    clearDetailLoadTimer();
    if (needLoad) {
      entry.loaded = false;
      setDetailLoadingUI(true, false);
      entry.iframe.src = url;
      state.detailLoadTimer = setTimeout(() => {
        if (!entry.loaded && entry.iframe.classList.contains('active')) {
          setDetailLoadingUI(true, true);
        }
      }, 8000);
    } else if (entry.loaded) {
      setDetailLoadingUI(false);
    } else {
      setDetailLoadingUI(true, false);
      state.detailLoadTimer = setTimeout(() => {
        if (!entry.loaded && entry.iframe.classList.contains('active')) {
          setDetailLoadingUI(true, true);
        }
      }, 8000);
    }

    updateStockDetailNav();
  }

  function updateStockDetailNav() {
    const { stockNavList, stockNavIndex } = state;
    const total = stockNavList.length;
    const sel = els.stockDetailSelect;
    sel.innerHTML = '';
    stockNavList.forEach((s, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${s.code} ${s.name}`;
      sel.appendChild(opt);
    });
    if (stockNavIndex >= 0 && stockNavIndex < total) sel.value = stockNavIndex;
    sel.style.display = total ? '' : 'none';
    if (total) {
      const prev = stockNavList[stockNavIndex - 1];
      const next = stockNavList[stockNavIndex + 1];
      els.stockDetailPrev.title = prev ? `上一个：${prev.code} ${prev.name}` : '上一个';
      els.stockDetailNext.title = next ? `下一个：${next.code} ${next.name}` : '下一个';
    }
    els.stockDetailPrev.disabled = stockNavIndex <= 0;
    els.stockDetailNext.disabled = stockNavIndex >= total - 1;
  }

  function navigateStock(delta) {
    const idx = state.stockNavIndex + delta;
    if (idx < 0 || idx >= state.stockNavList.length) return;
    const s = state.stockNavList[idx];
    openStockDetail(s.code, s.name);
  }

  function closeStockDetail() {
    clearDetailLoadTimer();
    els.stockDetail.classList.remove('open', 'loading');
    setDetailLoadingUI(false);
    els.stockListView.classList.remove('hidden');
    els.stockDetail.setAttribute('aria-hidden', 'true');
    hideAllFrames();
    highlightStockRow('');
    // 保留缓存 iframe，不销毁
  }

  const CACHE_EVENTS = 'limit_up_events_';
  // 盘中事件缓存有效期；收盘后可长期用
  const EVENTS_TTL_MS = 5 * 60 * 1000;

  function loadCacheEvents() {
    try {
      const raw = localStorage.getItem(CACHE_EVENTS);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      // 新格式 { savedAt, data }；旧格式直接是接口 JSON
      if (parsed && typeof parsed === 'object' && 'data' in parsed && 'savedAt' in parsed) {
        return { savedAt: Number(parsed.savedAt) || 0, data: parsed.data };
      }
      return { savedAt: 0, data: parsed };
    } catch (_) { return null; }
  }

  function saveCacheEvents(data) {
    try {
      localStorage.setItem(CACHE_EVENTS, JSON.stringify({ savedAt: Date.now(), data }));
    } catch (_) {}
  }

  function isEventsCacheFresh(entry) {
    if (!entry || entry.data == null) return false;
    const savedAt = Number(entry.savedAt) || 0;
    if (!savedAt) return false; // 旧缓存无时间戳，不当作新鲜
    const sd = new Date(savedAt);
    const savedYmd = `${sd.getFullYear()}${String(sd.getMonth() + 1).padStart(2, '0')}${String(sd.getDate()).padStart(2, '0')}`;
    const now = new Date();
    const closed = now.getHours() * 60 + now.getMinutes() >= 15 * 60;
    // 已收盘：当日缓存只要是今天写的即可
    if (closed) return savedYmd === (state.today || savedYmd);
    // 盘中：5 分钟内算新鲜
    return Date.now() - savedAt < EVENTS_TTL_MS;
  }

  function normalizeEventJson(json) {
    if (!json) return null;
    // 兼容误存的 { savedAt, data }
    if (json && typeof json === 'object' && 'savedAt' in json && 'data' in json && !Array.isArray(json.data?.data) && Array.isArray(json.data)) {
      // data 直接是 days 数组
      return { data: json.data };
    }
    if (json && typeof json === 'object' && 'savedAt' in json && 'data' in json) {
      return json.data;
    }
    return json;
  }

  async function loadEvents(opts = {}) {
    const { force = false } = opts;
    try {
      let json = null;

      // 非强制：优先内存 / 新鲜缓存，避免频繁打 news 接口
      if (!force) {
        if (state.eventRaw) {
          json = state.eventRaw;
        } else {
          const cached = loadCacheEvents();
          if (cached && isEventsCacheFresh(cached)) {
            json = normalizeEventJson(cached.data);
          }
        }
      }

      if (!json) {
        try {
          // news 域常被浏览器直连 403/CORS，失败时自动轮询代理
          json = await getJson(API.eventList(), { retryProxy: true });
          if (json) saveCacheEvents(json);
        } catch (e) {
          // 失败回退：内存 → 任意本地缓存
          const cached = loadCacheEvents();
          json = state.eventRaw || normalizeEventJson(cached?.data) || null;
          if (!json) {
            const hint = e.status === 403
              ? '接口拒绝直连（403）。请打开「设置 → 代理设置」选择 corsproxy.io 后点查询重试。'
              : `事件加载失败: ${e.message}`;
            els.eventPanel.innerHTML = msgHtml('warn', hint);
            els.eventMeta.textContent = '';
            return;
          }
        }
      }

      json = normalizeEventJson(json) || json;
      state.eventRaw = json;
      const days = Array.isArray(json?.data) ? json.data : (Array.isArray(json) ? json : []);
      state.events = days;
      renderEvents();
    } catch (e) {
      // 事件失败不影响板块
      try {
        els.eventPanel.innerHTML = msgHtml('warn', `事件加载异常: ${e.message || e}`);
        els.eventMeta.textContent = '';
      } catch (_) {}
    }
  }

  function fmtHeat(n) {
    const v = Number(n);
    if (!Number.isFinite(v)) return '-';
    if (v >= 1e4) {
      const w = v / 1e4;
      return (w >= 100 ? w.toFixed(0) : w.toFixed(w >= 10 ? 0 : 1)) + '万';
    }
    return String(Math.round(v));
  }

  function limitUpLabel(s) {
    if (s === 1) return '涨停';
    if (s === 2) return '炸板';
    return '';
  }

  function heatClass(n) {
    const v = Number(n) || 0;
    if (v >= 3e5) return '';
    if (v >= 5e4) return 'mid';
    return 'low';
  }

  function matchBlockByEvent(ev) {
    const names = new Set();
    const codes = new Set();
    if (ev.investmentDirection) names.add(ev.investmentDirection);
    (ev.themes || []).forEach((t) => {
      if (t.indexName) names.add(t.indexName);
      if (t.showName) names.add(t.showName);
      if (t.indexCode) codes.add(String(t.indexCode));
    });
    // exact name/code first
    let idx = state.blocks.findIndex((b) => codes.has(String(b.code)) || names.has(b.name));
    if (idx >= 0) return idx;
    // fuzzy: block name contained in theme/direction
    idx = state.blocks.findIndex((b) =>
      [...names].some((n) => n.includes(b.name) || b.name.includes(n))
    );
    return idx;
  }

  function renderEvents() {
    const panel = els.eventPanel;
    const meta = els.eventMeta;
    const targetIso = state.date ? `${state.date.slice(0,4)}-${state.date.slice(4,6)}-${state.date.slice(6,8)}` : '';
    const dayEvents = state.events.find(d => d.date === targetIso);

    if (!dayEvents || !dayEvents.eventList || !dayEvents.eventList.length) {
      panel.innerHTML = msgHtml('loading', '当日无热点事件');
      meta.textContent = '';
      return;
    }

    const events = [...dayEvents.eventList].sort((a, b) => (Number(b.heat) || 0) - (Number(a.heat) || 0));
    meta.textContent = `${events.length} 条`;

    let html = '<div class="ev-list">';
    events.forEach((ev, i) => {
      const themes = (ev.themes || []).slice(0, 4).map(t => `<span class="tag">${esc(t.showName)}</span>`).join('');
      const more = (ev.themes || []).length > 4 ? `<span class="tag">+${ev.themes.length - 4}</span>` : '';
      const s = (ev.topStocks || [])[0];
      let stockHtml = '<span class="ev-stock">—</span>';
      if (s) {
        const label = limitUpLabel(s.limitUpState);
        const badge = label ? `<span class="tag ${label === '涨停' ? 'first' : 'back'}">${label}</span>` : '';
        const rate = Number(s.risePercent);
        const rateStr = Number.isFinite(rate) ? `${rate.toFixed(2)}%` : '-';
        const rateCls = Number.isFinite(rate) && rate >= 0 ? 'up' : 'down';
        stockHtml = `<div class="ev-stock"><b>${esc(s.stockName)}</b><span class="code">${esc(s.stockCode)}</span><span class="rate ${rateCls}">${esc(rateStr)}</span>${badge}</div>`;
      }
      html += `<article class="ev-item" data-ev="${i}" title="点击定位关联板块">
        <div class="ev-top">
          <div class="ev-heat ${heatClass(ev.heat)}">${esc(fmtHeat(ev.heat))}</div>
          <div class="ev-title" title="${esc(ev.title)}">${esc(ev.title)}</div>
          <div class="ev-dir" title="${esc(ev.investmentDirection || '')}">${esc(ev.investmentDirection || '-')}</div>
        </div>
        <div class="ev-themes">${themes}${more}</div>
        ${stockHtml}
      </article>`;
    });
    html += '</div>';
    panel.innerHTML = html;

    panel.querySelectorAll('.ev-item').forEach((el) => {
      el.addEventListener('click', () => {
        const ev = events[Number(el.dataset.ev)];
        if (!ev || !state.blocks.length) return;
        const idx = matchBlockByEvent(ev);
        if (idx >= 0) selectBlock(idx);
        else setStatus(`未匹配到板块: ${ev.investmentDirection || '事件'}`);
      });
    });
  }

  function bindRawToggle(root) {
    root.querySelectorAll('.raw-toggle').forEach((el) => {
      el.addEventListener('click', () => {
        const pre = document.getElementById(el.dataset.raw);
        if (pre) pre.classList.toggle('open');
      });
    });
  }

  function selectBlock(idx) {
    state.selected = idx;
    state.tagFilter = 'all';
    closeStockDetail();
    renderBlocks();
    renderStocks();
  }

  function setDateByYmd(ymd, reload = true) {
    if (!ymd) return;
    let idx = state.dates.indexOf(ymd);
    if (idx === -1) {
      // 选中非交易日：吸附到最近交易日
      idx = -1;
      for (let i = state.dates.length - 1; i >= 0; i--) {
        if (state.dates[i] <= ymd) { idx = i; break; }
      }
      if (idx === -1) idx = 0;
      setStatus(`${fmtDate(ymd)} 非交易日，已切到 ${fmtDate(state.dates[idx])}`);
    }
    state.index = idx;
    state.date = state.dates[idx] || ymd;
    updateDateUi();
    if (reload) loadBlocks();
  }

  // ---------- data flow ----------
  async function initDates() {
    const seed = todayYmd();
    state.today = seed;
    try {
      const json = await getJson(API.tradeDay(seed), { retryProxy: true });
      const parsed = parseTradeDay(json, seed);
      state.dates = parsed.dates;
      state.tradeDayMap = parsed.map;
      state.todayIsTradeDay = parsed.isTrade;
      fillDateSelect();

      let idx = state.dates.indexOf(seed);
      if (idx === -1) {
        idx = -1;
        for (let i = state.dates.length - 1; i >= 0; i--) {
          if (state.dates[i] <= seed) { idx = i; break; }
        }
        if (idx === -1) idx = state.dates.length - 1;
      }
      state.index = Math.max(0, idx);
      state.date = state.dates[state.index] || seed;
      updateDateUi();
      if (!state.todayIsTradeDay) {
        setStatus(`今天 ${fmtDate(seed)} 非交易日，已切到 ${fmtDate(state.date)}`);
      }
      return true;
    } catch (e) {
      state.dates = [seed];
      state.index = 0;
      state.date = seed;
      state.todayIsTradeDay = null;
      state.tradeDayMap = {};
      fillDateSelect();
      updateDateUi();
      els.blockPanel.innerHTML = msgHtml(
        'warn',
        `交易日历不可用（${e.message}），无法判断是否交易日，已回退到 ${fmtDate(seed)}。`
      );
      return false;
    }
  }

  const CACHE_PREFIX = 'limit_up_blocks_';
  const CACHE_POOL_PREFIX = {
    limitUp: 'limit_up_pool_',
    openLimit: 'open_limit_pool_',
    limitDown: 'lower_limit_pool_',
  };
  const MARKET_CLOSE_MIN = 15 * 60; // 15:00

  function isAfterMarketClose(d = new Date()) {
    return d.getHours() * 60 + d.getMinutes() >= MARKET_CLOSE_MIN;
  }

  function ymdOfDate(d) {
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  }

  function isHistoricalDate(ymd) {
    return !!ymd && ymd < state.today;
  }

  /** 历史日，或交易日当天已收盘 → 可尝试定稿缓存 */
  function isFrozenDate(ymd) {
    if (!ymd) return false;
    if (ymd < state.today) return true;
    if (ymd === state.today) return isAfterMarketClose();
    return false;
  }

  /**
   * 缓存是否可作定稿使用：
   * - 历史日：有数据即可（旧格式无 savedAt 也接受）
   * - 当日：必须有 savedAt，且写入时间 ≥ 当日 15:00
   * 盘中写入的缓存不能在收盘后当定稿用。
   */
  function isValidFrozenCache(ymd, entry) {
    if (!entry) return false;
    const savedAt = entry.savedAt != null ? Number(entry.savedAt) : NaN;
    if (ymd < state.today) {
      // 历史：优先要求有 payload；有 savedAt 则校验写入日 ≥ 目标日
      if (!Number.isFinite(savedAt)) return true; // 兼容旧缓存
      const sd = new Date(savedAt);
      return ymdOfDate(sd) >= ymd;
    }
    if (ymd === state.today) {
      if (!Number.isFinite(savedAt)) return false; // 当日必须有写入时间
      const sd = new Date(savedAt);
      if (ymdOfDate(sd) !== ymd) return false;
      return isAfterMarketClose(sd);
    }
    return false;
  }

  function wrapCache(data) {
    return { savedAt: Date.now(), data };
  }

  function unwrapBlockCache(parsed) {
    if (!parsed) return null;
    // 新格式 { savedAt, data: apiJson|array|{data:[]} }
    if (parsed && typeof parsed === 'object' && 'data' in parsed && 'savedAt' in parsed) {
      const list = extractBlockList(parsed.data) || extractBlockList(parsed);
      return {
        savedAt: parsed.savedAt,
        data: Array.isArray(list) ? { data: list } : null,
        entry: parsed,
      };
    }
    // 旧格式：直接是接口 JSON / 数组
    const list = extractBlockList(parsed);
    return {
      savedAt: null,
      data: Array.isArray(list) ? { data: list } : null,
      entry: { savedAt: null, data: parsed },
    };
  }

  function loadCache(date, opts = {}) {
    const { requireFrozen = false } = opts;
    try {
      const raw = localStorage.getItem(CACHE_PREFIX + date);
      if (!raw) return null;
      const unwrapped = unwrapBlockCache(JSON.parse(raw));
      if (!unwrapped || !unwrapped.data) return null;
      if (requireFrozen && !isValidFrozenCache(date, unwrapped.entry)) return null;
      return unwrapped.data; // { data: blocks[] }
    } catch (_) { return null; }
  }

  function saveCache(date, data) {
    try {
      // 统一存 { data: blocks[] }，避免多层包裹导致读不出来
      const list = extractBlockList(data);
      if (!Array.isArray(list) || !list.length) return;
      localStorage.setItem(CACHE_PREFIX + date, JSON.stringify(wrapCache({ data: list })));
    } catch (_) {}
  }

  function loadPoolCache(kind, date, opts = {}) {
    const { requireFrozen = false, allowAny = false } = opts;
    try {
      const raw = localStorage.getItem((CACHE_POOL_PREFIX[kind] || '') + date);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed) return null;
      // 新格式带 savedAt；旧格式直接 {list,...}
      const entry = parsed.savedAt != null
        ? parsed
        : { savedAt: null, list: parsed.list, total: parsed.total, page: parsed.page, raw: parsed.raw };
      if (!Array.isArray(entry.list)) return null;
      if (requireFrozen && !isValidFrozenCache(date, entry)) return null;
      if (!allowAny && !requireFrozen) {
        // 默认：定稿场景才走缓存
      }
      return {
        list: entry.list,
        total: entry.total ?? entry.list.length,
        page: entry.page || 1,
        raw: entry.raw || null,
        savedAt: entry.savedAt,
      };
    } catch (_) { return null; }
  }

  function savePoolCache(kind, date, data) {
    try {
      localStorage.setItem((CACHE_POOL_PREFIX[kind] || '') + date, JSON.stringify({
        savedAt: Date.now(),
        list: data.list,
        total: data.total,
        page: data.page,
        raw: data.raw || null,
      }));
    } catch (_) {}
  }

  function blocksFromJson(json) {
    if (!json) return [];
    try {
      return parseBlocks(json);
    } catch (_) {
      return [];
    }
  }

  function clearBlockCache(date) {
    try { localStorage.removeItem(CACHE_PREFIX + date); } catch (_) {}
  }

  async function fetchBlockTopJson() {
    return getJson(API.blockTop(state.date), { retryProxy: true });
  }

  async function loadBlocks() {
    if (!state.date || state.loading) return;
    state.loading = true;
    els.btnLoad.disabled = true;
    setStatus('加载中...');
    els.blockPanel.innerHTML = skelHtml(8);
    els.stockPanel.innerHTML = skelHtml(6);
    if (els.eventPanel && !els.eventPanel.querySelector('.ev-list')) {
      els.eventPanel.innerHTML = skelHtml(4);
    }
    els.tagFilters.hidden = true;
    state.heightFilter = 'all';
    els.blockMeta.textContent = '';
    els.stockMeta.textContent = '';
    state.blocks = [];
    state.selected = -1;
    state.rawBlock = null;
    state.tagFilter = 'all';
    state.blockView = 'block';
    state.openLimitData = null;
    state.limitUpData = null;
    state.limitDownData = null;
    state.poolSelected = -1;
    document.querySelectorAll('#block-tabs .tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.view === 'block'));
    els.stockCard.style.display = '';
    closeStockDetail();

    const frozen = isFrozenDate(state.date);
    let json = null;
    let fromCache = false;
    let cacheFallback = false;

    // 1) 定稿缓存：必须能解析出板块列表，否则当无效
    if (frozen) {
      const cached = loadCache(state.date, { requireFrozen: true });
      if (cached && blocksFromJson(cached).length) {
        json = cached;
        fromCache = true;
      } else if (cached) {
        clearBlockCache(state.date);
      }
    }

    // 2) 缓存无效 → 请求接口（盘中始终走这里）
    if (!json) {
      try {
        json = await fetchBlockTopJson();
        const n = blocksFromJson(json).length;
        if (n > 0 && isFrozenDate(state.date)) saveCache(state.date, json);
        if (n === 0) {
          // 空响应：再试一次任意缓存兜底
          const any = loadCache(state.date, { requireFrozen: false });
          if (any && blocksFromJson(any).length) {
            json = any;
            fromCache = true;
            cacheFallback = true;
          }
        }
      } catch (e) {
        // 网络失败：任意缓存兜底（需能解析）
        const any = loadCache(state.date, { requireFrozen: false });
        if (any && blocksFromJson(any).length) {
          json = any;
          fromCache = true;
          cacheFallback = true;
        } else {
          const hint = !els.proxyUrl.value.trim()
            ? '可能是 CORS / 403，请打开「设置 → 代理设置」配置代理（推荐 corsproxy.io）后重试。'
            : `错误: ${e.message}`;
          els.blockPanel.innerHTML = msgHtml('error', `板块请求失败: ${e.message}`) + msgHtml('warn', hint);
          els.stockPanel.innerHTML = msgHtml('error', '无法加载个股');
          setStatus('失败');
          state.loading = false;
          els.btnLoad.disabled = false;
          loadEvents({ force: true });
          return;
        }
      }
    }

    if (json) {
      try {
        state.rawBlock = json;
        state.blocks = blocksFromJson(json);
        if (!state.blocks.length) {
          const nonTrade = state.dateIsTradeDay === false;
          els.blockPanel.innerHTML =
            msgHtml('warn', nonTrade
              ? `当日非交易日（${fmtDate(state.date)}），无板块涨停数据`
              : `无板块数据（${fmtDate(state.date)}）`) +
            msgHtml('warn', nonTrade
              ? '可切换到最近交易日查看，或点「查询」刷新。'
              : '若为交易日仍为空：请确认日期、代理后点「查询」重试。') +
            rawToggleHtml('raw-block');
          const raw = $('raw-block');
          if (raw) raw.textContent = JSON.stringify(json, null, 2);
          bindRawToggle(els.blockPanel);
          els.stockPanel.innerHTML = msgHtml('loading', '无数据');
          setStatus('无板块数据');
        } else {
          state.selected = 0;
          state.blockView = 'block';
          renderBlocks();
          renderStocks();
          if (fromCache) {
            const closedToday = state.date === state.today && isAfterMarketClose();
            setStatus(cacheFallback
              ? `缓存 ${fmtDate(state.date)} (网络不可用)`
              : closedToday
                ? `缓存 ${fmtDate(state.date)} (15:00后)`
                : `缓存 ${fmtDate(state.date)}`);
          } else {
            setStatus(new Date().toLocaleTimeString('zh-CN'));
          }
        }
      } catch (e) {
        els.blockPanel.innerHTML = msgHtml('error', `板块解析失败: ${e.message || e}`);
        els.stockPanel.innerHTML = msgHtml('error', '无法加载个股');
        setStatus('解析失败');
        clearBlockCache(state.date);
      }
    }

    state.loading = false;
    els.btnLoad.disabled = false;
    Promise.resolve().then(() => loadEvents({ force: true })).catch(() => {});
  }

  function shiftDate(delta) {
    const next = state.index + delta;
    if (next < 0 || next >= state.dates.length) return;
    setDateByYmd(state.dates[next], true);
  }

  function mdCell(v) {
    return String(v ?? '-').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
  }

  function poolRowMd(s) {
    const code = getVal(s, ['code']) || '-';
    const name = getVal(s, ['name']) || '-';
    const rate = getVal(s, ['change_rate']);
    const highDays = getVal(s, ['high_days']) || '-';
    const limitType = getVal(s, ['limit_up_type']) || '';
    const changeTag = getVal(s, ['change_tag']) || '';
    const ct = CHANGE_TAG[changeTag];
    const firstTs = getVal(s, ['first_limit_up_time']);
    const lastTs = getVal(s, ['last_limit_up_time']);
    const openNum = getVal(s, ['open_num']);
    const orderAmt = getVal(s, ['order_amount']);
    const turn = getVal(s, ['turnover_rate']);
    const reason = getVal(s, ['reason_type']) || '';
    const tagStr = [ct?.label, limitType, reason].filter(Boolean).join(' ');
    return `| ${mdCell(code)} | ${mdCell(name)} | ${mdCell(rate != null ? fmtPct(rate) : '-')} | ${mdCell(highDays)} | ${mdCell(fmtTime(firstTs))} | ${mdCell(fmtTime(lastTs))} | ${mdCell(openNum != null ? openNum : '-')} | ${mdCell(fmtMoney(orderAmt))} | ${mdCell(turn != null ? fmtPct(turn) : '-')} | ${mdCell(tagStr || '-')} |`;
  }

  function poolTableMd(list) {
    if (!list || !list.length) return '_（无数据）_';
    const head = `| 代码 | 名称 | 涨幅 | 连板 | 首次封板 | 最后封板 | 炸板次数 | 封单金额 | 换手 | 标签 |\n|------|------|------|------|---------|---------|---------|---------|------|------|`;
    return `${head}\n${list.map(poolRowMd).join('\n')}`;
  }

  function poolTotalFromResp(kind, d, listLen) {
    const pageTotal = Number(d?.page?.total);
    const pageCount = Number(d?.page?.count);
    const pageLimit = Number(d?.page?.limit) || 50;
    // page.total 有时是条数，有时像页数；优先用 count 字段
    const countHint = kind === 'limitUp'
      ? Number(d?.limit_up_count?.today?.num)
      : kind === 'limitDown'
        ? Number(d?.limit_down_count?.today?.num)
        : Number(d?.limit_up_count?.today?.open_num);
    if (Number.isFinite(countHint) && countHint > 0) return countHint;
    if (Number.isFinite(pageTotal) && pageTotal > 0) {
      // total 很小且 count 较大时，total 更像页数
      if (Number.isFinite(pageCount) && pageCount > 1 && pageTotal <= pageCount) {
        return pageTotal * pageLimit;
      }
      return pageTotal;
    }
    if (Number.isFinite(pageCount) && pageCount > 0) return pageCount * pageLimit;
    return listLen;
  }

  function isPoolComplete(pack) {
    if (!pack || !Array.isArray(pack.list) || !pack.list.length) return false;
    const total = Number(pack.total) || 0;
    if (total > 0 && pack.list.length >= total) return true;
    // total 未知但标记 complete
    return !!pack.complete;
  }

  async function fetchAllPoolPages(kind, seed = null) {
    const meta = poolMeta(kind);
    const apiFn = meta.api;
    const label = meta.label;
    const pageSize = 50;
    let list = Array.isArray(seed?.list) ? [...seed.list] : [];
    let total = Number(seed?.total) || 0;
    let raw = seed?.raw || null;
    let page = 1;
    if (list.length && total > 0) {
      page = Math.floor(list.length / pageSize) + 1;
    }
    const seen = new Set(list.map((x) => String(x.code || '')).filter(Boolean));
    const maxPages = 40;

    while (page <= maxPages) {
      setStatus(`加载${label}全量 ${list.length}${total ? '/' + total : ''} · 第${page}页`);
      const json = await getJson(apiFn(state.date, page, pageSize), { retryProxy: true });
      const d = json?.data || {};
      const chunk = Array.isArray(d.info) ? d.info : [];
      raw = raw || json;
      total = poolTotalFromResp(kind, d, list.length + chunk.length) || total;
      let added = 0;
      chunk.forEach((item) => {
        const c = String(item.code || '');
        if (c && !seen.has(c)) {
          seen.add(c);
          list.push(item);
          added += 1;
        } else if (!c) {
          list.push(item);
          added += 1;
        }
      });
      // 空页 / 无新增 / 已满
      if (!chunk.length || added === 0) break;
      if (total > 0 && list.length >= total) break;
      // API 返回不足一页，视为结束
      if (chunk.length < pageSize) break;
      page += 1;
    }

    return {
      list,
      total: total || list.length,
      page,
      raw,
      complete: true,
    };
  }

  async function ensurePoolLoaded(kind) {
    const meta = poolMeta(kind);
    const dataKey = meta.dataKey;
    const label = meta.label;

    // 1) 内存已完整
    if (isPoolComplete(state[dataKey])) return state[dataKey];

    // 2) 定稿缓存完整则用
    if (isFrozenDate(state.date)) {
      const cached = loadPoolCache(kind, state.date, { requireFrozen: true });
      if (isPoolComplete(cached) || (cached?.list?.length && cached.list.length >= (cached.total || 0) && (cached.total || 0) > 0)) {
        const pack = { ...cached, complete: true };
        state[dataKey] = pack;
        return pack;
      }
      // 缓存不完整：以缓存为种子继续翻页
      if (cached?.list?.length) state[dataKey] = cached;
    }

    // 3) 翻页拉全量（可从已有半截列表续拉）
    try {
      const seed = state[dataKey];
      const pack = await fetchAllPoolPages(kind, isPoolComplete(seed) ? null : seed);
      state[dataKey] = pack;
      if (isFrozenDate(state.date) && pack.list.length) savePoolCache(kind, state.date, pack);
      // 若当前正看该池，刷新列表为全量
      if (state.blockView === kind) {
        renderPoolSideList(kind, { openFirst: false });
      }
      setStatus(`${label}全量 ${pack.list.length} 只`);
      return pack;
    } catch (e) {
      const cached = loadPoolCache(kind, state.date, { requireFrozen: false, allowAny: true });
      if (cached?.list?.length) {
        state[dataKey] = { ...cached, complete: isPoolComplete(cached) };
        return state[dataKey];
      }
      if (state[dataKey]?.list?.length) return state[dataKey];
      throw e;
    }
  }

  function openExportModal() {
    if (!els.exportModal) return;
    const both = els.exportModal.querySelector('input[name="export-scope"][value="both"]');
    if (both) both.checked = true;
    els.exportModal.classList.add('open');
    els.exportModal.setAttribute('aria-hidden', 'false');
  }

  function closeExportModal() {
    if (!els.exportModal) return;
    els.exportModal.classList.remove('open');
    els.exportModal.setAttribute('aria-hidden', 'true');
  }

  function exportBlockReport() {
    const block = state.blocks[state.selected];
    if (!block || !block.stocks.length) {
      setStatus('请先选择一个有数据的板块');
      return;
    }

    const prompt = els.promptText.value.trim() || DEFAULT_PROMPT;
    const dateStr = fmtDate(state.date);
    const stocks = block.stocks;
    const stockLines = stocks.map((s) => {
      const tags = (s.tags || []).join(' ');
      const reason = s.reasonType || s.reasonInfo || '-';
      const time = fmtTime(s.firstTime);
      return `| ${mdCell(s.code)} | ${mdCell(s.name)} | ${mdCell(fmtPct(s.changeRate))} | ${mdCell(s.continueNum >= 2 ? s.continueNum + '连板' : '首板')} | ${mdCell(time)} | ${mdCell(`${tags} ${reason}`.trim())} |`;
    }).join('\n');

    const stockTable = `| 代码 | 名称 | 涨幅 | 连板 | 封板时间 | 概念标签 |\n|------|------|------|------|---------|---------|\n${stockLines}`;

    const dataSection = `---

## 待分析数据

**核心事件驱动**：（请用户在此补充一句话）

**日期**：${dateStr}

**板块**：${block.name}（涨停 ${block.limitUpNum} 只，板块涨幅 ${fmtPct(block.change)}）

**涨停个股名单**：

${stockTable}
`;

    const fullContent = `${prompt}\n${dataSection}`;
    downloadBlob(`复盘报告_${state.date}_${block.name}.md`, fullContent, 'text/markdown;charset=utf-8');
    setStatus(`已导出: ${block.name} (${stocks.length} 只)`);
  }

  async function exportPoolReport(scope) {
    const wantLimit = scope === 'both' || scope === 'all' || scope === 'limitUp';
    const wantOpen = scope === 'both' || scope === 'all' || scope === 'openLimit';
    const wantDown = scope === 'all' || scope === 'limitDown';
    const prompt = els.promptText.value.trim() || DEFAULT_PROMPT;
    const dateStr = fmtDate(state.date);
    const parts = [];
    let totalN = 0;
    const labels = [];

    try {
      if (wantLimit) {
        const pack = await ensurePoolLoaded('limitUp');
        const list = pack?.list || [];
        totalN += list.length;
        labels.push(`涨停${list.length}`);
        parts.push(`### 涨停池（${list.length} 只）\n\n${poolTableMd(list)}`);
      }
      if (wantOpen) {
        const pack = await ensurePoolLoaded('openLimit');
        const list = pack?.list || [];
        totalN += list.length;
        labels.push(`炸板${list.length}`);
        parts.push(`### 炸板池（${list.length} 只）\n\n${poolTableMd(list)}`);
      }
      if (wantDown) {
        const pack = await ensurePoolLoaded('limitDown');
        const list = pack?.list || [];
        totalN += list.length;
        labels.push(`跌停${list.length}`);
        parts.push(`### 跌停池（${list.length} 只）\n\n${poolTableMd(list)}`);
      }
    } catch (e) {
      setStatus(`导出失败: ${e.message}`);
      return;
    }

    if (!totalN) {
      setStatus('所选范围暂无数据，请先加载涨停/炸板/跌停');
      return;
    }

    const scopeLabelMap = {
      both: '涨停+炸板',
      all: '涨停+炸板+跌停',
      limitUp: '涨停',
      openLimit: '炸板',
      limitDown: '跌停',
    };
    const scopeLabel = scopeLabelMap[scope] || scope;
    const dataSection = `---

## 待分析数据

**核心事件驱动**：（请用户在此补充一句话）

**日期**：${dateStr}

**数据范围**：${scopeLabel}

**名单统计**：${labels.join(' / ')}

${parts.join('\n\n')}
`;

    const fullContent = `${prompt}\n${dataSection}`;
    downloadBlob(`复盘报告_${state.date}_${scopeLabel}.md`, fullContent, 'text/markdown;charset=utf-8');
    setStatus(`已导出: ${scopeLabel} (${labels.join(' · ')})`);
  }

  function exportReport() {
    if (state.blockView === 'limitUp' || state.blockView === 'openLimit' || state.blockView === 'limitDown') {
      openExportModal();
      return;
    }
    exportBlockReport();
  }

  // ---------- events ----------
  function openSettings(pane) {
    els.settingsMenu.classList.add('open');
    els.btnSettings.classList.add('active');
    if (pane) switchSettingsPane(pane);
  }
  function closeSettings() {
    els.settingsMenu.classList.remove('open');
    els.btnSettings.classList.remove('active');
  }
  function toggleSettings() {
    if (els.settingsMenu.classList.contains('open')) closeSettings();
    else openSettings();
  }
  function switchSettingsPane(name) {
    els.settingsMenu.querySelectorAll('.menu-tab').forEach((t) => {
      t.classList.toggle('active', t.dataset.pane === name);
    });
    els.settingsMenu.querySelectorAll('.menu-pane').forEach((p) => {
      p.classList.toggle('active', p.id === `pane-${name}`);
    });
  }

  els.btnSettings.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSettings();
  });
  els.btnSettingsClose.addEventListener('click', closeSettings);
  els.settingsMenu.querySelectorAll('.menu-tab').forEach((tab) => {
    tab.addEventListener('click', () => switchSettingsPane(tab.dataset.pane));
  });
  els.settingsMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => closeSettings());


  els.proxyPreset.addEventListener('change', () => {
    if (els.proxyPreset.value) els.proxyUrl.value = els.proxyPreset.value;
    saveProxy();
  });
  els.proxyUrl.addEventListener('change', saveProxy);
  els.btnPrev.addEventListener('click', () => shiftDate(-1));
  els.btnNext.addEventListener('click', () => shiftDate(1));
  els.btnLoad.addEventListener('click', () => loadBlocks());
  document.getElementById('block-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn || btn.classList.contains('active')) return;
    state.blockView = btn.dataset.view;
    document.querySelectorAll('#block-tabs .tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
    els.stockCard.style.display = '';
    if (state.blockView === 'block') {
      els.blockPanel.onscroll = null;
      closeStockDetail();
      renderBlocks();
      renderStocks();
    } else if (state.blockView === 'limitUp') {
      state.poolSelected = 0;
      loadLimitUpPool(1, false);
    } else if (state.blockView === 'openLimit') {
      state.poolSelected = 0;
      loadOpenLimitPool(1, false);
    } else if (state.blockView === 'limitDown') {
      state.poolSelected = 0;
      loadLimitDownPool(1, false);
    }
  });
  els.btnExport.addEventListener('click', exportReport);
  if (els.exportModalCancel) {
    els.exportModalCancel.addEventListener('click', closeExportModal);
  }
  if (els.exportModalOk) {
    els.exportModalOk.addEventListener('click', async () => {
      const checked = els.exportModal?.querySelector('input[name="export-scope"]:checked');
      const scope = checked?.value || 'both';
      closeExportModal();
      els.btnExport.disabled = true;
      try {
        await exportPoolReport(scope);
      } finally {
        els.btnExport.disabled = false;
      }
    });
  }
  if (els.exportModal) {
    els.exportModal.addEventListener('click', (e) => {
      if (e.target === els.exportModal) closeExportModal();
    });
  }
  els.dateSelect.addEventListener('change', () => setDateByYmd(els.dateSelect.value, true));
  els.datePicker.addEventListener('change', () => setDateByYmd(toYmd(els.datePicker.value), true));
  els.stockDetailBack.addEventListener('click', closeStockDetail);
  els.stockDetailPrev.addEventListener('click', () => navigateStock(-1));
  els.stockDetailNext.addEventListener('click', () => navigateStock(1));
  els.stockDetailSelect.addEventListener('change', () => {
    const idx = parseInt(els.stockDetailSelect.value, 10);
    if (!isNaN(idx)) {
      const s = state.stockNavList[idx];
      if (s) openStockDetail(s.code, s.name);
    }
  });
  // stock-detail 内 ↗：TV 新窗口 / 资料新窗口
  els.stockDetailExt.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const code = currentDetailCode();
    if (!code) return;
    window.open(isTvOn() ? stockTvUrl(code) : stockPageUrl(code), '_blank', 'noopener');
  });
  if (els.tvToggle) {
    els.tvToggle.addEventListener('change', saveTvSetting);
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (els.exportModal?.classList.contains('open')) closeExportModal();
      else if (els.stockDetail.classList.contains('open')) closeStockDetail();
      else closeSettings();
      return;
    }
    if (!els.stockDetail.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); navigateStock(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); navigateStock(1); }
  });

  function savePrompt() {
    try { localStorage.setItem('limit_up_prompt', els.promptText.value); } catch (_) {}
  }
  els.promptText.addEventListener('change', savePrompt);
  els.promptText.addEventListener('blur', savePrompt);
  $('btn-prompt-reset').addEventListener('click', () => {
    els.promptText.value = DEFAULT_PROMPT;
    savePrompt();
  });

  function copyCurrentCodes() {
    const codes = (state.stockNavList || []).map((s) => s.code).filter(Boolean);
    if (!codes.length) {
      showToast('当前列表无代码可复制', 'err');
      return;
    }
    const text = codes.join('\n');
    const done = () => showToast(`已复制 ${codes.length} 只代码`, 'ok');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (_) { showToast('复制失败', 'err'); }
        ta.remove();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (_) { showToast('复制失败', 'err'); }
      ta.remove();
    }
  }

  if (els.thsScale) {
    els.thsScale.addEventListener('change', saveThsScale);
  }
  if (els.thsPageVer) {
    els.thsPageVer.addEventListener('change', saveThsPageVer);
  }
  if (els.darkToggle) {
    els.darkToggle.addEventListener('change', saveDarkMode);
  }
  if (els.eventToggle) {
    els.eventToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleEventCard();
    });
  }
  if (els.btnCopyCodes) {
    els.btnCopyCodes.addEventListener('click', (e) => {
      e.stopPropagation();
      copyCurrentCodes();
    });
  }
  if (els.btnDetailRetry) {
    els.btnDetailRetry.addEventListener('click', () => {
      const code = currentDetailCode();
      if (!code) return;
      const key = frameCacheKey(code, 'ths');
      const entry = frameCache.map.get(key);
      if (entry) {
        entry.loaded = false;
        entry.iframe.src = 'about:blank';
        setTimeout(() => {
          openStockDetail(code, state.stockNavList[state.stockNavIndex]?.name || '');
        }, 30);
      } else {
        openStockDetail(code, state.stockNavList[state.stockNavIndex]?.name || '');
      }
    });
  }

  // ---------- boot ----------
  loadProxy();
  loadTvSetting();
  loadThsScale();
  loadThsPageVer();
  loadDarkMode();
  loadEventCollapsed();
  try {
    const saved = localStorage.getItem('limit_up_prompt');
    els.promptText.value = saved || DEFAULT_PROMPT;
  } catch (_) {
    els.promptText.value = DEFAULT_PROMPT;
  }
  (async () => {
    await initDates();
    await loadBlocks();
  })();
})();
</script>
</body>
</html>
